<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back office · Jack Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0820; --panel: #151030; --panel2: #1D1745; --line: #2E2560; --t1: #F4F1FF; --t2: #B9B3D9; --t3: #8A83AD;
  --gold: #F5B301; --gold2: #FFE27A; --violet: #7C3AED; --ok: #34D399; --bad: #F87171; --warn: #FBBF24;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--t1); font: 500 16px/1.4 Rajdhani, system-ui, sans-serif; }
body { min-height: 100vh; background: #06040F radial-gradient(ellipse 120% 600px at 50% 0%, #2A1F6B 0%, #130E36 45%, #06040F 100%) no-repeat; }
h1, h2, .display { font-family: Orbitron, sans-serif; font-weight: 900; letter-spacing: 1px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 12px; color: var(--t2); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 10px; padding: 8px 14px; background: var(--panel2); color: var(--t1); font-weight: 700; border: 1px solid var(--line); }
button:hover { border-color: var(--violet); }
button:disabled { opacity: .5; cursor: default; }
button.gold { background: linear-gradient(180deg, #FFE27A, #F5B301 60%, #D99A00); color: #0B0820; border: 0; }
button.violet { background: var(--violet); border: 0; }
button.small { padding: 4px 10px; font-size: 14px; }
button.link { background: none; border: 0; color: var(--t2); text-decoration: underline; padding: 0; }
input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0F0B28; outline: none; }
input:focus, select:focus { border-color: var(--violet); }
label { display: block; font-size: 14px; color: var(--t2); margin: 10px 0 4px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
.card { background: rgba(21, 16, 48, .92); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.login { max-width: 380px; margin: 10vh auto 0; }
.login .brand { text-align: center; margin-bottom: 18px; }
.login .brand b { color: var(--gold); }
.err { color: var(--bad); min-height: 20px; margin-top: 8px; font-size: 15px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.top .grow { flex: 1; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-family: Orbitron, sans-serif; font-weight: 700; letter-spacing: 1px; background: var(--violet); }
.badge.AGENT { background: #0E7490; } .badge.PLAYER { background: #4D7C0F; } .badge.OPERATOR { background: #9A3412; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat .k { color: var(--t3); font-size: 14px; }
.stat .v { font-family: Orbitron, sans-serif; font-weight: 900; font-size: 22px; color: var(--gold2); }
.grid2 { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
.grid2 > * { min-width: 0; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; color: var(--t3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid rgba(46, 37, 96, .5); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
tr.disabled td:not(:last-child) { opacity: .5; }
.scroll { overflow-x: auto; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.muted { color: var(--t3); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.creds { margin-top: 12px; padding: 12px; border-radius: 12px; background: #0F0B28; border: 1px dashed var(--gold); }
.creds code { font-size: 17px; color: var(--gold2); }
dialog { background: var(--panel); color: var(--t1); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(380px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(6, 4, 15, .7); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.quick button { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.hidden { display: none !important; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); }
.crumb { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <section id="login" class="login card hidden">
    <div class="brand"><h1>JACK <b>VAULT</b></h1><div class="muted">Back office</div></div>
    <div class="tabs"><button type="button" data-mode="staff" aria-pressed="true">Distributor / Agent</button><button type="button" data-mode="operator" aria-pressed="false">Operator</button></div>
    <form id="loginForm">
      <div id="staffFields">
        <label for="lu">Username</label><input id="lu" autocomplete="username" required>
        <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
      </div>
      <div id="opFields" class="hidden">
        <label for="lk">Admin key</label><input id="lk" type="password" autocomplete="off">
        <div class="muted" style="font-size:14px;margin-top:6px">The server's ADMIN_KEY. Operators create distributors and issue their points.</div>
      </div>
      <button class="gold" style="width:100%;margin-top:16px" type="submit">LOG IN</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <!-- App -->
  <section id="app" class="hidden">
    <div class="top">
      <h1>JACK <span style="color:var(--gold)">VAULT</span></h1>
      <span class="grow"></span>
      <span id="who"></span>
      <button id="refresh" class="small">Refresh</button>
      <button id="logout" class="small">Log out</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid2">
      <div class="card">
        <h2 id="createTitle">CREATE</h2>
        <form id="createForm">
          <label for="cu">Username</label><input id="cu" autocomplete="off" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}" title="3-32 letters, digits, _ . or -">
          <label for="cp">Password</label>
          <div class="row"><input id="cp" autocomplete="new-password" required minlength="6" maxlength="64"><button type="button" id="gen" class="small" style="flex:0 0 auto">Generate</button></div>
          <label for="ca">Starting balance (optional)</label><input id="ca" inputmode="decimal" placeholder="0.00">
          <button class="violet" style="width:100%;margin-top:14px" type="submit" id="createBtn">CREATE</button>
          <div class="err" id="createErr"></div>
        </form>
        <div id="creds" class="creds hidden"></div>
      </div>
      <div class="card">
        <div class="crumb hidden" id="crumb"></div>
        <div class="row" style="margin-bottom:10px"><h2 id="listTitle" style="margin:0">ACCOUNTS</h2><input id="filter" placeholder="Search username" style="max-width:220px"></div>
        <div class="scroll"><table id="list"></table></div>
        <div class="muted hidden" id="empty" style="padding:12px 0">No accounts yet. Create one on the left.</div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="row" style="margin-bottom:10px"><h2 style="margin:0">LEDGER</h2><select id="ledgerFilter" style="max-width:240px"></select></div>
      <div class="scroll"><table id="ledger"></table></div>
      <div style="text-align:center;margin-top:10px"><button id="more" class="small hidden">Load older</button></div>
    </div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle" style="color:var(--t1)"></h2>
    <div id="dlgInfo" class="muted"></div>
    <div id="dlgAmount">
      <label for="da">Amount</label><input id="da" inputmode="decimal" placeholder="0.00" autocomplete="off">
      <div class="quick" id="quick"></div>
    </div>
    <div id="dlgPass" class="hidden">
      <label for="dp">New password</label><div class="row"><input id="dp" autocomplete="new-password"><button type="button" id="dgen" class="small" style="flex:0 0 auto">Generate</button></div>
    </div>
    <div class="err" id="dlgErr"></div>
    <div class="row" style="margin-top:12px"><button type="button" id="dlgCancel">Cancel</button><button type="submit" class="gold" id="dlgOk">OK</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (c) => (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toCents = (s) => {
  const t = String(s ?? "").replace(/,/g, "").trim();
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * 100);
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""));
const genPass = () => {
  const a = "abcdefghjkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => a[b % a.length]).join("");
};
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
};
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}

// ---------------------------------------------------------------- API

const S = {
  mode: store.get("office.mode") || "staff", // staff | operator
  token: store.get("office.token"),
  adminKey: store.get("office.key"),
  me: null,
  accounts: [],
  viewParent: null, // distributor looking at one agent's players
  ledger: [],
};

async function api(method, path, body) {
  const headers = { "content-type": "application/json" };
  if (S.mode === "operator") headers["x-admin-key"] = S.adminKey || "";
  else if (S.token) headers.authorization = "Bearer " + S.token;
  let res;
  try {
    res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw Object.assign(new Error("Can't reach the server. Try again."), { code: "NETWORK" });
  }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    if ((res.status === 401 || res.status === 403) && path !== "/api/office/login") {
      if (S.mode === "staff" || res.status === 403) logout(data && data.error ? data.error.message : "Please log in again");
    }
    throw Object.assign(new Error((data && data.error && data.error.message) || res.statusText), { code: data && data.error && data.error.code });
  }
  return data;
}

// ---------------------------------------------------------------- login

function setLoginMode(m) {
  S.mode = m;
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  $("#staffFields").classList.toggle("hidden", m !== "staff");
  $("#opFields").classList.toggle("hidden", m !== "operator");
  $("#lu").required = $("#lp").required = m === "staff";
  $("#lk").required = m === "operator";
}
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => setLoginMode(b.dataset.mode)));

$("#loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#loginErr").textContent = "";
  try {
    if (S.mode === "staff") {
      const r = await api("POST", "/api/office/login", { username: $("#lu").value, password: $("#lp").value });
      S.token = r.token;
      store.set("office.token", r.token);
    } else {
      S.adminKey = $("#lk").value;
      await api("GET", "/api/admin/accounts");
      store.set("office.key", S.adminKey);
    }
    store.set("office.mode", S.mode);
    $("#lp").value = $("#lk").value = "";
    await enter();
  } catch (e) {
    $("#loginErr").textContent = e.message;
  }
});

function logout(msg) {
  if (S.mode === "staff" && S.token) fetch("/api/office/logout", { method: "POST", headers: { authorization: "Bearer " + S.token } }).catch(() => {});
  S.token = S.adminKey = null;
  S.me = null;
  store.set("office.token", null);
  store.set("office.key", null);
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  setLoginMode(S.mode);
  if (typeof msg === "string") $("#loginErr").textContent = msg;
}
$("#logout").addEventListener("click", () => logout());

// ---------------------------------------------------------------- data

const CHILD = { OPERATOR: "DISTRIBUTOR", DISTRIBUTOR: "AGENT", AGENT: "PLAYER" };
const NOUN = { DISTRIBUTOR: "distributor", AGENT: "agent", PLAYER: "player" };

async function enter() {
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  S.viewParent = null;
  await refresh();
}

async function refresh() {
  if (S.mode === "operator") {
    const r = await api("GET", "/api/admin/accounts");
    S.me = { role: "OPERATOR", username: "operator", audit: r.audit };
    S.all = r.accounts;
    S.accounts = r.accounts.filter((a) => a.role === "DISTRIBUTOR");
    S.ledger = [];
  } else {
    S.me = await api("GET", "/api/office/me");
    const q = S.viewParent ? "?parent=" + encodeURIComponent(S.viewParent.id) : "";
    S.accounts = (await api("GET", "/api/office/accounts" + q)).accounts;
    if (!S.viewParent) S.children = S.accounts;
    await loadLedger(true);
  }
  render();
}

async function loadLedger(reset) {
  if (S.mode === "operator") return;
  const acct = $("#ledgerFilter").value;
  const before = reset || !S.ledger.length ? "" : "&before=" + S.ledger[S.ledger.length - 1].entryId;
  const r = await api("GET", "/api/office/ledger?limit=50" + (acct ? "&account=" + encodeURIComponent(acct) : "") + before);
  S.ledger = reset ? r.entries : S.ledger.concat(r.entries);
  $("#more").classList.toggle("hidden", r.entries.length < 50);
  renderLedger();
}
$("#more").addEventListener("click", () => loadLedger(false).catch((e) => toast(e.message)));
$("#ledgerFilter").addEventListener("change", () => loadLedger(true).catch((e) => toast(e.message)));
$("#refresh").addEventListener("click", () => refresh().then(() => toast("Updated")).catch((e) => toast(e.message)));

// ---------------------------------------------------------------- render

function render() {
  const me = S.me;
  const child = CHILD[me.role];
  const readOnly = !!S.viewParent;
  $("#who").innerHTML = `<span class="badge ${esc(me.role)}">${esc(me.role)}</span> <b>${esc(me.username)}</b>`;

  const stats = [];
  if (me.role === "OPERATOR") {
    const a = me.audit;
    stats.push(["Points issued", money(a.issuedCents)], ["Distributors", String(S.accounts.length)], ["Accounts", String(S.all.length)],
      ["Ledger check", a.staffBalancesMatchLedger && a.pointsConserved ? "OK" : "MISMATCH"]);
  } else {
    stats.push(["My points", money(me.balanceCents)], [me.role === "DISTRIBUTOR" ? "Agents" : "Players", String(me.children)],
      [me.role === "DISTRIBUTOR" ? "Points with agents" : "Coins with players", money(me.childrenBalanceCents)]);
  }
  $("#stats").innerHTML = stats.map(([k, v]) => `<div class="card stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

  $("#createTitle").textContent = "CREATE " + NOUN[child].toUpperCase();
  $("#createBtn").textContent = "CREATE " + NOUN[child].toUpperCase();
  $("#createForm").parentElement.classList.toggle("hidden", readOnly);

  const crumb = $("#crumb");
  crumb.classList.toggle("hidden", !readOnly);
  if (readOnly) {
    crumb.innerHTML = `<button class="link" id="back">← My agents</button> <span class="muted">/ ${esc(S.viewParent.username)}'s players (view only)</span>`;
    $("#back").onclick = () => { S.viewParent = null; refresh().catch((e) => toast(e.message)); };
  }
  const listRole = readOnly ? "PLAYER" : child;
  $("#listTitle").textContent = (readOnly ? "PLAYERS" : "MY " + NOUN[child].toUpperCase() + "S");

  const f = $("#ledgerFilter");
  const keep = f.value;
  const opts = (S.children || []).map((a) => `<option value="${esc(a.id)}">${esc(a.username)}</option>`).join("");
  f.innerHTML = `<option value="">All</option>` + opts;
  f.value = [...f.options].some((o) => o.value === keep) ? keep : "";
  f.parentElement.parentElement.classList.toggle("hidden", me.role === "OPERATOR");

  renderList(listRole, readOnly);
}

function renderList(listRole, readOnly) {
  const q = $("#filter").value.trim().toLowerCase();
  const rows = S.accounts.filter((a) => !q || a.username.toLowerCase().includes(q));
  const kids = listRole !== "PLAYER";
  const kidNoun = listRole === "DISTRIBUTOR" ? "Agents" : "Players";
  $("#empty").classList.toggle("hidden", S.accounts.length > 0);
  $("#list").innerHTML = !S.accounts.length ? "" : `<thead><tr><th>Username</th><th>Status</th><th class="num">Balance</th>${kids ? `<th class="num">${kidNoun}</th><th class="num">Their balance</th>` : ""}<th class="num">Created</th>${readOnly ? "" : "<th></th>"}</tr></thead><tbody>` +
    rows.map((a) => `<tr class="${a.status === "DISABLED" ? "disabled" : ""}">
      <td><b>${esc(a.username)}</b></td>
      <td>${a.status === "ACTIVE" ? '<span class="pos">Active</span>' : '<span class="neg">Disabled</span>'}</td>
      <td class="num"><b>${money(a.balanceCents)}</b></td>
      ${kids ? `<td class="num">${a.children ?? 0}</td><td class="num">${money(a.childrenBalanceCents ?? 0)}</td>` : ""}
      <td class="num muted">${esc(new Date(a.createdAt).toLocaleDateString())}</td>
      ${readOnly ? "" : `<td><div class="acts">
        ${S.me.role === "OPERATOR" ? `<button class="small gold" data-act="issue" data-id="${esc(a.id)}">Issue</button><button class="small" data-act="revoke" data-id="${esc(a.id)}">Take back</button>`
          : `<button class="small gold" data-act="load" data-id="${esc(a.id)}">Load</button><button class="small" data-act="redeem" data-id="${esc(a.id)}">Redeem</button>`}
        ${S.me.role === "DISTRIBUTOR" ? `<button class="small" data-act="players" data-id="${esc(a.id)}">Players</button>` : ""}
        <button class="small" data-act="password" data-id="${esc(a.id)}">Password</button>
        <button class="small" data-act="status" data-id="${esc(a.id)}">${a.status === "ACTIVE" ? "Disable" : "Enable"}</button>
      </div></td>`}
    </tr>`).join("") + "</tbody>";
  $("#list").querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => action(b.dataset.act, S.accounts.find((a) => a.id === b.dataset.id))));
}
$("#filter").addEventListener("input", () => S.me && renderList(S.viewParent ? "PLAYER" : CHILD[S.me.role], !!S.viewParent));

const TYPE = { ISSUE: "Issued", REVOKE: "Taken back", LOAD: "Load", REDEEM: "Redeem" };
function renderLedger() {
  const me = S.me;
  $("#ledger").innerHTML = !S.ledger.length ? `<tbody><tr><td class="muted">No coin movements yet.</td></tr></tbody>` :
    `<thead><tr><th>Time</th><th>Type</th><th>From</th><th>To</th><th class="num">Amount</th><th class="num">My balance after</th><th>By</th></tr></thead><tbody>` +
    S.ledger.map((e) => {
      const mineOut = e.fromId === me.id, mineIn = e.toId === me.id;
      const after = mineOut ? e.fromBalanceAfterCents : mineIn ? e.toBalanceAfterCents : null;
      return `<tr><td class="muted" style="white-space:nowrap">${esc(new Date(e.at).toLocaleString())}</td><td>${esc(TYPE[e.type] || e.type)}</td>
        <td>${esc(e.from)}</td><td>${esc(e.to)}</td>
        <td class="num ${mineIn ? "pos" : mineOut ? "neg" : ""}">${mineIn ? "+" : mineOut ? "−" : ""}${money(e.amountCents)}</td>
        <td class="num">${after == null ? '<span class="muted">—</span>' : money(after)}</td><td class="muted">${esc(e.actor)}</td></tr>`;
    }).join("") + "</tbody>";
}

// ---------------------------------------------------------------- create

$("#gen").addEventListener("click", () => ($("#cp").value = genPass()));
$("#createForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#createErr").textContent = "";
  const username = $("#cu").value.trim(), password = $("#cp").value, amt = $("#ca").value.trim();
  const cents = amt ? toCents(amt) : 0;
  if (amt && !(cents > 0)) return ($("#createErr").textContent = "Starting balance must be an amount like 50 or 25.50");
  const btn = $("#createBtn");
  btn.disabled = true;
  try {
    const op = S.me.role === "OPERATOR";
    const a = await api("POST", op ? "/api/admin/distributors" : "/api/office/accounts", { username, password });
    let loadErr = "";
    if (cents > 0) {
      try {
        await api("POST", op ? `/api/admin/accounts/${a.id}/issue` : `/api/office/accounts/${a.id}/load`, { requestId: uuid(), amountCents: cents });
      } catch (e) { loadErr = e.message; }
    }
    $("#createForm").reset();
    const c = $("#creds");
    c.classList.remove("hidden");
    c.innerHTML = `<div style="margin-bottom:6px">${esc(NOUN[a.role][0].toUpperCase() + NOUN[a.role].slice(1))} created. Give these login details to them:</div>
      <div>Username: <code>${esc(a.username)}</code></div><div>Password: <code>${esc(password)}</code></div>
      ${a.role === "PLAYER" ? `<div class="muted" style="margin-top:4px">They log in on the game's start screen.</div>` : `<div class="muted" style="margin-top:4px">They log in on this back-office page.</div>`}
      ${loadErr ? `<div class="err">Account made, but the starting balance failed: ${esc(loadErr)}</div>` : ""}
      <button class="small" id="copyCreds" style="margin-top:8px">Copy</button>`;
    $("#copyCreds").onclick = () => navigator.clipboard?.writeText(`Username: ${a.username}\nPassword: ${password}`).then(() => toast("Copied"), () => toast("Copy failed"));
    await refresh();
  } catch (e) {
    $("#createErr").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});

// ---------------------------------------------------------------- actions

let dlgAction = null;
function openDialog({ title, info, amount, password, ok, quick, run }) {
  $("#dlgTitle").textContent = title;
  $("#dlgInfo").innerHTML = info || "";
  $("#dlgAmount").classList.toggle("hidden", !amount);
  $("#dlgPass").classList.toggle("hidden", !password);
  $("#da").value = "";
  $("#dp").value = password ? genPass() : "";
  $("#dlgErr").textContent = "";
  $("#dlgOk").textContent = ok;
  $("#quick").innerHTML = (quick || []).map(([label, v]) => `<button type="button" class="small" data-v="${esc(v)}">${esc(label)}</button>`).join("");
  $("#quick").querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => ($("#da").value = b.dataset.v)));
  // One requestId per dialog: a resend after a dropped connection can't move coins twice.
  dlgAction = { run, requestId: uuid() };
  $("#dlg").showModal();
  setTimeout(() => (amount ? $("#da") : password ? $("#dp") : $("#dlgOk")).focus(), 30);
}
$("#dlgCancel").addEventListener("click", () => $("#dlg").close());
$("#dgen").addEventListener("click", () => ($("#dp").value = genPass()));
$("#dlgForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = $("#dlgOk");
  btn.disabled = true;
  $("#dlgErr").textContent = "";
  try {
    const msg = await dlgAction.run(dlgAction.requestId);
    $("#dlg").close();
    if (msg) toast(msg);
    await refresh();
  } catch (e) {
    $("#dlgErr").textContent = e.message;
    if (e.code !== "NETWORK") dlgAction.requestId = uuid();
  } finally {
    btn.disabled = false;
  }
});

function amountFromDialog() {
  const c = toCents($("#da").value);
  if (!(c > 0)) throw new Error("Enter an amount like 50 or 25.50");
  return c;
}

function action(act, a) {
  if (!a) return;
  const base = S.me.role === "OPERATOR" ? "/api/admin/accounts/" : "/api/office/accounts/";
  const quickAmts = [["10", "10"], ["20", "20"], ["50", "50"], ["100", "100"], ["500", "500"]];
  if (act === "players") {
    S.viewParent = a;
    return refresh().catch((e) => toast(e.message));
  }
  if (act === "load" || act === "issue") {
    const mine = S.me.role === "OPERATOR" ? "" : ` You have <b style="color:var(--gold2)">${money(S.me.balanceCents)}</b>.`;
    return openDialog({
      title: (act === "issue" ? "Issue points to " : "Load ") + a.username,
      info: `Current balance ${money(a.balanceCents)}.${mine}`,
      amount: true, ok: act === "issue" ? "ISSUE" : "LOAD", quick: quickAmts,
      run: async (requestId) => {
        const cents = amountFromDialog();
        await api("POST", base + a.id + (act === "issue" ? "/issue" : "/load"), { requestId, amountCents: cents });
        return `${act === "issue" ? "Issued" : "Loaded"} ${money(cents)} to ${a.username}`;
      },
    });
  }
  if (act === "redeem" || act === "revoke") {
    return openDialog({
      title: (act === "revoke" ? "Take points back from " : "Redeem from ") + a.username,
      info: `${a.username} has <b style="color:var(--gold2)">${money(a.balanceCents)}</b>. Redeemed coins go back to ${act === "revoke" ? "the operator" : "your balance"}.`,
      amount: true, ok: act === "revoke" ? "TAKE BACK" : "REDEEM",
      quick: [["All", (a.balanceCents / 100).toFixed(2)]],
      run: async (requestId) => {
        const cents = amountFromDialog();
        await api("POST", base + a.id + (act === "revoke" ? "/issue" : "/redeem"), { requestId, amountCents: act === "revoke" ? -cents : cents });
        return `${act === "revoke" ? "Took back" : "Redeemed"} ${money(cents)} from ${a.username}`;
      },
    });
  }
  if (act === "password") {
    return openDialog({
      title: "New password for " + a.username, info: "They'll be logged out everywhere and must use the new password.",
      password: true, ok: "SET PASSWORD",
      run: async () => {
        const password = $("#dp").value;
        await api("POST", base + a.id + "/password", { password });
        $("#creds").classList.remove("hidden");
        $("#creds").innerHTML = `<div>New login for <b>${esc(a.username)}</b>:</div><div>Password: <code>${esc(password)}</code></div>`;
        return "Password changed";
      },
    });
  }
  if (act === "status") {
    const disable = a.status === "ACTIVE";
    return openDialog({
      title: (disable ? "Disable " : "Enable ") + a.username,
      info: disable ? "They're logged out and can't log in until you enable them. You can still redeem their balance." : "They'll be able to log in again.",
      ok: disable ? "DISABLE" : "ENABLE",
      run: async () => {
        await api("POST", base + a.id + "/status", { status: disable ? "DISABLED" : "ACTIVE" });
        return `${a.username} ${disable ? "disabled" : "enabled"}`;
      },
    });
  }
}

// ---------------------------------------------------------------- start

setLoginMode(S.mode);
if ((S.mode === "staff" && S.token) || (S.mode === "operator" && S.adminKey)) {
  enter().catch(() => logout());
} else {
  $("#login").classList.remove("hidden");
}
</script>
</body>
