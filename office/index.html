<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back Office · Jack Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens from design-source/backoffice/project/Tokens.dc.html */
:root {
  --navy: #1B2B44; --bg: #F3F4F6; --panel: #FFFFFF; --line: #E5E7EB; --line-input: #D1D5DB; --rail: #E9EDF2;
  --blue: #1A78B4; --blue-dark: #166FA3; --blue-light: #1E88C8; --blue-tint: #E3F0FA;
  --green: #15803D; --green-tint: #DCFCE7; --red: #DC2626; --red-tint: #FEF2F2;
  --amber: #B45309; --amber-tint: #FEF3C7; --balance: #FFF8E6; --balance-line: #F1E3B8;
  --text: #111827; --text-2: #4B5563; --text-3: #6B7280; --text-decor: #9CA3AF; --zebra: #F9FAFB;
  --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --radius: 6px; --radius-panel: 8px; --h-row: 36px; --h-row-btn: 28px;
  --dur-fast: 120ms; --dur-dialog: 160ms;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 14px/20px var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); } a:hover { color: var(--blue-dark); }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.nums { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); } .hint { color: var(--text-3); font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.in { color: var(--green); } .out { color: var(--red); }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 1px; }

/* Buttons */
.btn { height: var(--h-row); border-radius: var(--radius); border: 1px solid transparent; padding: 0 14px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: background var(--dur-fast), border-color var(--dur-fast); background: var(--blue); color: #fff; }
.btn:hover { background: var(--blue-dark); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.load { background: var(--green); } .btn.load:hover { background: #116632; }
.btn.redeem { background: #fff; color: var(--red); border-color: var(--red); } .btn.redeem:hover { background: var(--red-tint); }
.btn.danger { background: var(--red); } .btn.danger:hover { background: #B91C1C; }
.btn.neutral { background: #fff; color: var(--text); border-color: var(--line-input); font-weight: 500; } .btn.neutral:hover { background: var(--zebra); border-color: var(--text-decor); }
.btn.link { background: none; border: 0; color: var(--blue); padding: 0; height: auto; font-weight: 500; text-decoration: underline; }
.btn.sm { height: var(--h-row-btn); padding: 0 10px; font-size: 13px; }
.btn.wide { width: 100%; }
.btn .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.shortcuts { display: flex; gap: 6px; flex-wrap: wrap; }
.shortcuts button { height: 28px; padding: 0 12px; border-radius: var(--radius); border: 0; background: var(--blue-light); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.shortcuts button[aria-pressed="true"] { background: var(--blue-dark); box-shadow: inset 0 0 0 2px #0E4F78; }

/* Forms */
input[type=text], input[type=password], input[type=search], input[type=datetime-local], input:not([type]), select, textarea {
  height: var(--h-row); border: 1px solid var(--line-input); border-radius: var(--radius); padding: 0 10px; background: #fff; min-width: 0; }
textarea { height: auto; padding: 8px 10px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--blue-light); outline: 2px solid rgba(30,136,200,.25); outline-offset: 0; }
input::placeholder { color: var(--text-decor); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .lbl { font-size: 13px; font-weight: 500; color: var(--text-2); }
.field .err { color: var(--red); font-size: 13px; min-height: 0; }
.pw { position: relative; display: flex; } .pw input { flex: 1; padding-right: 40px; }
.pw .eye { position: absolute; right: 2px; top: 2px; width: 32px; height: 32px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.amount { position: relative; display: flex; } .amount input { flex: 1; text-align: right; padding-right: 58px; font-variant-numeric: tabular-nums; }
.amount .suffix { position: absolute; right: 10px; top: 8px; color: var(--text-3); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); cursor: pointer; user-select: none; }
.toggle .sw { width: 40px; height: 22px; border-radius: 11px; border: 1px solid var(--line-input); background: var(--line); position: relative; flex-shrink: 0; transition: background var(--dur-fast); }
.toggle .sw::after { content: ""; position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 9px; background: #fff; border: 1px solid var(--line-input); transition: left var(--dur-fast); }
.toggle[aria-checked="true"] .sw { background: var(--blue); border-color: var(--blue); }
.toggle[aria-checked="true"] .sw::after { left: 19px; border-color: var(--blue); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-input); background: #fff; cursor: pointer; font-variant-numeric: tabular-nums; }
.chips button:hover { border-color: var(--blue-light); color: var(--blue-dark); }

/* Shell */
.top { height: 56px; background: var(--navy); color: #fff; display: flex; align-items: center; padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 20; }
.top .brand { font-weight: 700; font-size: 15px; } .top .sub { color: #C7D2E3; }
.top .sep { color: #8A9AB5; } .top .title { font-weight: 600; font-size: 15px; }
.top .welcome { color: #C7D2E3; } .top .welcome strong { color: #fff; font-weight: 600; }
.top .logout { height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid #5B6B85; color: #fff; background: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
.top .burger { display: none; width: 36px; height: 36px; border: 0; background: none; color: #fff; cursor: pointer; align-items: center; justify-content: center; }
.roletag { height: 20px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; display: inline-flex; align-items: center; }
.roletag.AGENT { background: #0F766E; color: #fff; } .roletag.DISTRIBUTOR { background: var(--blue); color: #fff; } .roletag.OPERATOR { background: var(--line); color: var(--navy); } .roletag.PLAYER { background: #4D7C0F; color: #fff; }
.strip { height: 36px; background: var(--balance); border-bottom: 1px solid var(--balance-line); display: flex; align-items: center; padding: 0 24px; gap: 10px; position: sticky; top: 56px; z-index: 19; }
.strip .bal { color: var(--blue); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.strip .refresh { width: 28px; height: 28px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.strip .tz { color: var(--text-2); font-size: 13px; margin-left: auto; }
.layout { display: flex; min-height: calc(100vh - 92px); }
.side { width: 240px; flex-shrink: 0; background: var(--rail); border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 92px; height: calc(100vh - 92px); overflow-y: auto; }
.side a, .side button { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--radius); background: #fff; color: var(--text); text-decoration: none; font-weight: 500; border: 0; border-left: 3px solid transparent; cursor: pointer; text-align: left; width: 100%; }
.side a:hover { background: #F5F8FB; }
.side a[aria-current="page"] { background: var(--blue-tint); color: var(--blue-dark); font-weight: 600; border-left-color: var(--blue); }
.side .spacer { flex: 1; }
.side button { color: var(--text-2); }
main { flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.scrim { display: none; }

/* Panels and cards */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.flush { padding: 0; gap: 0; overflow: hidden; }
.panel.flush > .phead { padding: 16px 24px 10px; margin: 0; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.phead h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--blue); }
.cols { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stat .k { font-size: 13px; font-weight: 500; color: var(--text-2); }
.stat .v { font-size: 28px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats.small .v { font-size: 20px; line-height: 28px; }
.banner { border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner.error { background: var(--red-tint); color: #991B1B; border: 1px solid #FECACA; }
.banner.warn { background: var(--amber-tint); color: #92400E; border: 1px solid #FDE68A; }
.banner.info { background: var(--blue-tint); color: #0E4F78; border: 1px solid #BFDBF0; }
.banner.ok { background: var(--green-tint); color: #14532D; border: 1px solid #BBF7D0; }
.empty { padding: 32px 16px; text-align: center; color: var(--text-2); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pill { height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }
.pill.ACTIVE, .pill.LOAD, .pill.ISSUE, .pill.ok { background: var(--green-tint); color: var(--green); }
.pill.DISABLED { background: var(--line); color: var(--text-2); }
.pill.LOCKED, .pill.low { background: var(--amber-tint); color: var(--amber); }
.pill.REDEEM, .pill.REVOKE, .pill.bad { background: #FEE2E2; color: #B91C1C; }
.pill.feat { background: var(--blue-tint); color: var(--blue-dark); }
.pill.role { background: var(--zebra); color: var(--text-2); border: 1px solid var(--line); font-size: 11px; height: 18px; padding: 0 6px; margin-left: 6px; }

/* Tables */
.tbl-wrap { overflow: auto; max-height: 70vh; border-top: 1px solid var(--line); }
.panel > .tbl-wrap:first-child { border-top: 0; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
.tbl th { background: var(--blue); color: #fff; font-size: 13px; font-weight: 600; height: 36px; padding: 0 10px; text-align: left; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
.tbl th.sortable { cursor: pointer; } .tbl th .arrow { opacity: .8; margin-left: 4px; }
.tbl td { height: 36px; padding: 4px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
.tbl tbody tr:nth-child(even) td { background: var(--zebra); }
.tbl tbody tr:nth-child(odd) td { background: #fff; }
.tbl tbody tr:hover td { background: #EEF5FB; }
.tbl tbody tr.sel td { background: var(--blue-tint); }
.tbl tbody tr.click { cursor: pointer; }
.tbl tfoot td { font-weight: 700; background: #F3F6F9; border-top: 2px solid var(--line-input); position: sticky; bottom: 0; }
.tbl .acts { display: flex; gap: 4px; }
.tbl .acts .btn.sm { padding: 0 8px; }
.tbl .more { display: none; }
.tbl .more.always { display: inline-flex; }
.tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-2); gap: 8px; flex-wrap: wrap; }
.pager select { height: 28px; padding: 0 6px; font-size: 13px; }
.older { display: flex; justify-content: center; padding: 10px; border-top: 1px solid var(--line); }

/* Skeleton */
.skel { display: block; height: 14px; border-radius: 4px; background: linear-gradient(90deg, #ECEFF3 25%, #F6F7F9 50%, #ECEFF3 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Dialogs, drawer, toasts */
.overlay { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; animation: fade var(--dur-dialog); }
.dialog { width: 480px; max-width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; background: #fff; border-radius: var(--radius-panel); box-shadow: 0 10px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; animation: pop var(--dur-dialog); }
.dialog.wide { width: 640px; }
.dialog .dh, .drawer .dh { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dialog .dh h3, .drawer .dh h3 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog .dh .x, .drawer .dh .x { width: 32px; height: 32px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.dialog .db, .drawer .db { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog .df, .drawer .df { padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; }
.kv > :nth-child(odd) { color: var(--text-2); }
.kv > * { min-width: 0; overflow-wrap: anywhere; }
.preview { background: var(--zebra); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; font-variant-numeric: tabular-nums; }
.creds { background: var(--green-tint); border: 1px solid #BBF7D0; border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; background: #fff; z-index: 51; box-shadow: -8px 0 24px rgba(0,0,0,.15); display: flex; flex-direction: column; animation: slide var(--dur-dialog); }
.drawer .db { overflow-y: auto; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.98); opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.toasts { position: fixed; top: 100px; right: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: var(--radius); padding: 10px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.1); min-width: 240px; max-width: 360px; transition: opacity 200ms; }
.toast.error { border-left-color: var(--red); }
.sheet button { width: 100%; justify-content: flex-start; }

/* Login */
.login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px 16px; }
.login .mark { display: flex; align-items: center; gap: 10px; color: var(--navy); }
.login .mark b { font-size: 20px; } .login .mark span { color: var(--text-2); font-size: 16px; }
.login form { width: 400px; max-width: 100%; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: var(--radius); padding: 3px; gap: 3px; }
.tabs button { height: 34px; border: 0; border-radius: 5px; background: none; color: var(--text-2); font-weight: 500; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ptabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
.ptabs button { height: 36px; padding: 0 16px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--text-2); font-weight: 500; }
.ptabs button[aria-pressed="true"] { color: var(--blue-dark); border-bottom-color: var(--blue); font-weight: 600; }

/* Domain bits */
.chart { width: 100%; max-width: 760px; height: auto; display: block; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flow .box { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; background: var(--zebra); display: flex; flex-direction: column; min-width: 130px; }
.flow .box b { font-variant-numeric: tabular-nums; }
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line-input); border-radius: var(--radius-panel); padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: #fff; text-align: left; }
.pcard[aria-pressed="true"] { border: 2px solid var(--blue); padding: 15px; background: #F5FAFE; }
.pcard[disabled] { cursor: not-allowed; opacity: .55; background: var(--zebra); }
.pcard .big { font-size: 28px; line-height: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pcard dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; }
.pcard dt { color: var(--text-2); } .pcard dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.grid5 span { height: 34px; border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: var(--zebra); }
.grid5 span.hit { background: var(--green-tint); border-color: #86EFAC; color: var(--green); }
.check { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.check .mark { width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }
.check .mark.ok { background: var(--green); } .check .mark.bad { background: var(--red); }

@media print {
  body.printing > :not(.overlay) { display: none !important; }
  body.printing .overlay { position: static; background: none; }
  body.printing .dialog { box-shadow: none; width: 100%; }
  body.printing .df, body.printing .dh .x { display: none; }
}

/* Phone */
@media (max-width: 860px) {
  .top { padding: 0 12px; gap: 8px; }
  .top .burger { display: inline-flex; }
  .top .sub, .top .sep, .top .welcome, .top .logout span, .top .brand { display: none; }
  .top .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip { padding: 0 16px; }
  .side { position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; z-index: 40; transform: translateX(-100%); transition: transform 160ms; width: 280px; }
  body.drawer-open .side { transform: none; }
  body.drawer-open .scrim { display: block; position: fixed; inset: 0; background: rgba(17,24,39,.4); z-index: 39; }
  main { padding: 16px; }
  .panel { padding: 16px; }
  .panel.flush > .phead { padding: 12px 16px 8px; }
  .cols { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px 14px; } .stat .v { font-size: 20px; line-height: 26px; }
  .tbl td:first-child, .tbl th:first-child { position: sticky; left: 0; z-index: 1; }
  .tbl th:first-child { z-index: 3; }
  .tbl .acts.full { display: none; }
  .tbl .more { display: inline-flex; }
  .btn, .shortcuts button, .chips button { min-height: 36px; }
  .kv { grid-template-columns: 1fr; }
  .drawer { width: 100%; }
  .row > input, .row > select { flex: 1 1 140px; }
}
</style>
</head>

<div id="app"></div>

<script>
"use strict";
/*
 * Jack Vault back office: one page for operators, distributors and agents.
 * Plain DOM, no build step. Every value from the server is inserted as text,
 * never as HTML. Built from design-source/backoffice (Prompts 0-15).
 */

// ---------------------------------------------------------------- tiny DOM helpers

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked" || k === "disabled" || k === "selected") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  append(el, kids);
  return el;
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
const SVG = "http://www.w3.org/2000/svg";

// ---------------------------------------------------------------- bar chart

function barChart(days, labels = ["Loaded", "Redeemed"]) {
  const W = 640, H = 180, padL = 56, padB = 24, padT = 8;
  const max = Math.max(1, ...days.flatMap((d) => [d.a, d.b]));
  const step = (W - padL - 8) / Math.max(1, days.length);
  const bw = Math.min(18, step / 3);
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${labels[0]} vs ${labels[1]} per day` });
  for (const f of [0, 0.5, 1]) {
    svg.append(s("line", { x1: padL, x2: W, y1: y(max * f), y2: y(max * f), stroke: "#E5E7EB" }));
    svg.append(s("text", { x: padL - 6, y: y(max * f) + 4, "text-anchor": "end", "font-size": 11, fill: "#6B7280" }, money(max * f).replace(/\.00$/, "")));
  }
  days.forEach((d, i) => {
    const x = padL + i * step + step / 2;
    svg.append(s("rect", { x: x - bw - 1, y: y(d.a), width: bw, height: Math.max(0, H - padB - y(d.a)), fill: "#15803D", rx: 2 }, s("title", {}, `${d.label} ${labels[0]} ${money(d.a)}`)));
    svg.append(s("rect", { x: x + 1, y: y(d.b), width: bw, height: Math.max(0, H - padB - y(d.b)), fill: "#DC2626", rx: 2 }, s("title", {}, `${d.label} ${labels[1]} ${money(d.b)}`)));
    svg.append(s("text", { x, y: H - 6, "text-anchor": "middle", "font-size": 11, fill: "#6B7280" }, d.label));
  });
  return h("div", {}, svg, h("div", { class: "legend" }, h("span", {}, h("i", { style: "background:#15803D" }), labels[0]), h("span", {}, h("i", { style: "background:#DC2626" }), labels[1])));
}
/** Fills missing days in a { day, loadedCents, redeemedCents } list for the last n days. */
function lastDays(list, n = 7) {
  const p = zparts(Date.now());
  const map = new Map(list.map((d) => [d.day, d]));
  return Array.from({ length: n }, (_, i) => {
    const t = new Date(Date.UTC(p.y, p.m - 1, p.d - (n - 1 - i)));
    const key = t.toISOString().slice(0, 10);
    const d = map.get(key) || { loadedCents: 0, redeemedCents: 0 };
    return { label: key.slice(5), a: d.loadedCents, b: d.redeemedCents };
  });
}

function word(role) { return { PLAYER: "player", AGENT: "agent", DISTRIBUTOR: "distributor" }[role] || "account"; }

/**
 * Load / Redeem (distributor, agent) and Issue / Take back (operator) with
 * quick chips, a preview, balance checks and one requestId per dialog, so a
 * retried click never moves coins twice.
 */
function transferDialog(kind, target, done) {
  const op = S.me.role === "OPERATOR";
  const w = word(target.role);
  const into = kind === "load" || kind === "issue";
  const requestId = newRequestId();
  const titles = { load: `Load coins to ${op ? "" : target.role === "AGENT" ? "agent " : ""}${target.username}`, redeem: `Redeem coins from ${target.role === "AGENT" ? "agent " : ""}${target.username}`, issue: `Issue points to ${target.username}`, revoke: `Take back points from ${target.username}` };
  const okLabel = { load: "LOAD", redeem: "REDEEM", issue: "ISSUE", revoke: "TAKE BACK" }[kind];
  const okCls = into ? "load" : "danger";
  const amount = h("input", { inputmode: "decimal", placeholder: "0.00", "aria-label": "Amount" });
  const note = h("input", { placeholder: "Optional, e.g. weekly top-up", maxlength: 200 });
  const err = h("div", { class: "err", role: "alert" });
  const preview = h("div", { class: "preview" });
  const chips = op ? [1000, 5000, 10000] : [10, 20, 50, 100];
  const fill = (c) => { amount.value = amountText(c); check(); };
  const okBtn = btn(okLabel, okCls, () => submit(false));
  function check() {
    const c = parseAmount(amount.value);
    err.textContent = "";
    let ok = c > 0;
    if (amount.value && !(c > 0)) { err.textContent = "Enter an amount like 50 or 12.50"; ok = false; }
    else if (c > 0 && into && !op && c > S.me.balanceCents) { err.textContent = `You only have ${money(S.me.balanceCents)}. Lower the amount or ask your ${S.me.role === "AGENT" ? "distributor" : "operator"} for more.`; ok = false; }
    else if (c > 0 && !into && c > target.balanceCents) { err.textContent = `${w[0].toUpperCase() + w.slice(1)} only has ${money(target.balanceCents)}`; ok = false; }
    const v = c > 0 ? c : 0;
    const t = target.balanceCents + (into ? v : -v);
    preview.textContent = !ok ? "After: —" : op ? `After: ${w} ${money(t)}` : `After: you ${money(S.me.balanceCents + (into ? -v : v))}, ${w} ${money(t)}`;
    okBtn.disabled = !ok;
    return ok;
  }
  amount.addEventListener("input", check);
  amount.addEventListener("keydown", (e) => { if (e.key === "Enter" && check()) submit(false); });
  const d = dialog({ title: titles[kind] });
  const form = () => [
    kv(op ? null : ["Your balance", h("b", {}, money(S.me.balanceCents))], `${w[0].toUpperCase() + w.slice(1)} balance`, h("b", {}, money(target.balanceCents))),
    field("Amount", h("span", { class: "amount" }, amount, h("span", { class: "suffix" }, "coins")), err),
    h("div", { class: "row" }, h("div", { class: "chips" }, chips.map((c) => h("button", { type: "button", onclick: () => fill(c * 100) }, count(c)))),
      !into ? h("span", { style: "margin-left:auto" }, btn(kind === "revoke" ? "Take back all" : "Redeem all", "link", () => fill(target.balanceCents))) : null),
    op ? field("Note", note) : null,
    preview,
  ];
  d.setBody(form());
  d.setActions(btn("Cancel", "neutral", d.close), okBtn);
  check();
  async function submit(confirmed) {
    if (!check()) return;
    const c = parseAmount(amount.value);
    if (kind === "issue" && c > 1_000_000 && !confirmed) {
      d.setBody(h("div", {}, `Issue ${money(c)} points to ${target.username}? This creates new points.`));
      d.setActions(btn("Back", "neutral", () => { d.setBody(form()); d.setActions(btn("Cancel", "neutral", d.close), okBtn); check(); }), btn("Issue " + money(c), "load", () => submit(true)));
      return;
    }
    okBtn.disabled = true;
    okBtn.replaceChildren(h("span", { class: "spin" }), okLabel);
    try {
      await post(`/api/office/accounts/${encodeURIComponent(target.id)}/${kind}`, { requestId, amountCents: c, note: note.value || undefined });
      d.close();
      const verb = { load: "Loaded", redeem: "Redeemed", issue: "Issued", revoke: "Took back" }[kind];
      toast(`${verb} ${money(c)} ${into ? "to" : "from"} ${target.username}`);
      await refreshMe();
      if (done) done();
    } catch (e) {
      okBtn.replaceChildren(okLabel);
      d.setBody(form(), errorBanner(e));
      d.setActions(btn("Cancel", "neutral", d.close), okBtn);
      check();
    }
  }
}

/** A ledger list with "Load older" (cursor paging). */
function ledgerList({ query, cols, empty = "No transactions in this period.", onLoaded, extraCols }) {
  let entries = [];
  const holder = h("div", {});
  const olderBtn = btn("Load older", "neutral sm", () => more());
  const table = dataTable({ rows: [], cols, empty, older: olderBtn, actions: extraCols });
  holder.append(table);
  async function more(reset) {
    const q = new URLSearchParams(query());
    q.set("limit", "100");
    if (!reset && entries.length) q.set("before", entries[entries.length - 1].entryId);
    olderBtn.disabled = true;
    const r = await get("/api/office/ledger", q);
    entries = reset ? r.entries : entries.concat(r.entries);
    olderBtn.disabled = r.entries.length < 100;
    olderBtn.classList.toggle("hidden", !entries.length);
    table.update(entries);
    if (onLoaded) onLoaded(entries);
  }
  holder.reload = () => more(true);
  holder.entries = () => entries;
  return holder;
}

    const { days } = await get("/api/office/daily", new URLSearchParams(nonNull({ account: agent.id, from: st.from, to: st.to, tz: tz() })));

// ---------------------------------------------------------------- settings (all roles, Prompt 6)

const ZONES = ["UTC", "America/New_York", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu", "Europe/London", "Asia/Manila", "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney"];
PAGES.settings = async (main) => {
  const me = S.me;
  // Account + change password
  const cur = passwordInput({ autocomplete: "current-password" });
  const next = passwordInput();
  const again = passwordInput();
  const rule = h("div", { class: "hint" }, "At least 10 characters with an upper-case letter and a number");
  const pwErr = h("div", {});
  const strong = (p) => p.length >= 10 && /[A-Z]/.test(p) && /[0-9]/.test(p);
  next.input.addEventListener("input", () => { rule.style.color = next.input.value && !strong(next.input.value) ? "var(--red)" : ""; });
  const savePw = btn("Save", "", async () => {
    pwErr.replaceChildren();
    if (!strong(next.input.value)) { rule.style.color = "var(--red)"; return; }
    if (next.input.value !== again.input.value) { pwErr.replaceChildren(h("div", { class: "banner error" }, "The new passwords don't match.")); return; }
    savePw.disabled = true;
    try {
      await post("/api/office/me/password", { currentPassword: cur.input.value, newPassword: next.input.value });
      [cur, next, again].forEach((p) => (p.input.value = ""));
      toast("Password changed. Other sessions were logged out.");
      loadSessions();
    } catch (e) { pwErr.replaceChildren(errorBanner(e.code === "BAD_PASSWORD" ? new ApiError(e.code, e.message) : e)); }
    savePw.disabled = false;
  });
  // Preferences
  const zones = ZONES.includes(me.timeZone) ? ZONES : [me.timeZone, ...ZONES];
  const zoneSel = h("select", { "aria-label": "Time zone" }, zones.map((z) => h("option", { value: z, selected: z === me.timeZone }, `${z.replace(/_/g, " ")} (${zoneLabel(z)})`)));
  const lang = h("select", { "aria-label": "Language" }, h("option", {}, "English"), h("option", { disabled: true }, "More languages later"));
  const savePrefs = btn("Save", "", async () => {
    try { await post("/api/office/me/prefs", { timeZone: zoneSel.value }); await refreshMe(); toast("Preferences saved"); render(); }
    catch (e) { toast(errText(e), "error"); }
  });
  // Sessions
  const sessions = h("div", {});
  async function loadSessions() {
    const r = await get("/api/office/me/sessions");
    sessions.replaceChildren(dataTable({ rows: r.sessions, empty: "No sessions", cols: [
      { label: "Device / browser", value: (s) => [browserName(s.userAgent), s.current ? h("span", { class: "pill ok", style: "margin-left:6px" }, "This session") : null] },
      { label: "IP", value: (s) => s.ip || "—" }, { label: "Logged in", value: (s) => fmtTime(s.createdAt, false) }, { label: "Last active", value: (s) => fmtTime(s.lastSeenAt, false) }] }),
      h("div", { style: "padding:10px 0 0" }, btn("Log out all other sessions", "neutral", async () => { const x = await post("/api/office/me/sessions/logout-others"); toast(`Logged out ${x.loggedOut} other session${x.loggedOut === 1 ? "" : "s"}`); loadSessions(); }, { disabled: r.sessions.length < 2 })));
  }
  main.replaceChildren(
    panel("Account", null,
      kv("Account", h("b", {}, me.username), "Role", h("span", {}, h("span", { class: "roletag " + me.role }, me.role)), "Created", fmtTime(me.createdAt, false),
        "Parent", me.parent ? `${me.parent.role[0] + me.parent.role.slice(1).toLowerCase()}: ${me.parent.username}` : me.role === "DISTRIBUTOR" ? "Operator" : "—"),
      h("div", { style: "display:grid;gap:12px;max-width:420px" },
        h("div", { class: "lbl", style: "font-size:14px;color:var(--text);font-weight:600" }, "Change password"),
        field("Current password", cur.el),
        field("New password", next.el, rule),
        field("Confirm new password", again.el), pwErr, h("div", {}, savePw))),
    panel("Preferences", null, h("div", { style: "display:grid;gap:12px;max-width:420px" },
      field("Time zone", zoneSel, h("span", { class: "hint" }, "All times on every page use it.")),
      field("Language", lang), h("div", {}, savePrefs))),
    panel("Security", null,
      h("div", { class: "row" }, h("b", { style: "font-weight:600" }, "Authenticator app (2FA)"), pill("Off", "bad"), h("span", { class: "hint" }, "Two-step codes are coming in a later update."), h("span", { class: "grow" }), btn("Set up", "neutral", null, { disabled: true })),
      h("div", { class: "lbl", style: "font-size:14px;color:var(--text);font-weight:600" }, "Active sessions"), sessions));
  await load(sessions, loadSessions);
};
function browserName(ua) {
  if (!ua) return "Unknown device";
  const b = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : ua.split(" ")[0];
  const os = /iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac OS/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "";
  return os ? `${b} on ${os}` : b;
}

  S.token = store.sget("jv.office.token");
  if (!S.token) return showLogin();
  try { await enter(); }
  catch { endSession(); }
