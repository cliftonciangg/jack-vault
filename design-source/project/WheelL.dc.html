<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super Wheel bonus, landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;family=Cinzel:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.gold{background:linear-gradient(180deg,#FFE27A 0%,#F5B301 55%,#B87400 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(245,179,1,.7))}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 50% 120% at 30% 50%, #3B2A05 0%, #130E36 45%, #06040F 100%); color: #FFFFFF; font-family: 'Rajdhani', 'Segoe UI', sans-serif; display: flex; align-items: center; gap: 24px; padding: 12px 75px 21px">
  <!-- wheel -->
  <div style="position: relative; width: 340px; height: 340px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
    <svg width="340" height="340" viewBox="-180 -180 360 360" style="position: absolute; inset: 0" aria-hidden="true">
      <defs><radialGradient id="rimL" cx="50%" cy="50%" r="50%"><stop offset=".86" stop-color="#B87400"></stop><stop offset=".93" stop-color="#FFE27A"></stop><stop offset="1" stop-color="#B87400"></stop></radialGradient></defs>
      <circle r="178" fill="url(#rimL)"></circle>
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="12">
        <path d="{{s.d}}" fill="{{s.fill}}" stroke="#0B0820" stroke-width="2"></path>
        <text transform="{{s.tx}}" fill="{{s.ink}}" font-family="Orbitron, sans-serif" font-weight="900" font-size="{{s.fs}}" text-anchor="middle" dominant-baseline="middle">{{s.label}}</text>
      </sc-for>
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="24"><circle cx="{{b.x}}" cy="{{b.y}}" r="5" fill="{{b.c}}"></circle></sc-for>
      <circle r="56" fill="#0B0820" stroke="#F5B301" stroke-width="4"></circle>
      <path d="M-16 -186 L16 -186 L0 -150 Z" fill="#FFF3E0" stroke="#FF7A1A" stroke-width="3"></path>
    </svg>
    <button aria-label="Spin the wheel" style="position: relative; width: 94px; height: 94px; border-radius: 47px; border: 4px solid #F5B301; background: radial-gradient(circle at 40% 30%, #FFD3A3 0%, #FF7A1A 55%, #C2410C 100%); box-shadow: 0 0 36px rgba(255,122,26,.7); color: #0B0820; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 19px; letter-spacing: 1px; padding: 0">SPIN</button>
  </div>

  <!-- right: title, bet, prize table -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span class="gold" style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 30px; letter-spacing: 2px; line-height: 1">SUPER WHEEL</span>
      <div style="display: flex; gap: 8px">
        <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(21,16,48,.85); border: 1px solid #3B2F7A; display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">BET</span><span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; color: #FFE27A">1.25</span></div>
        <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(21,16,48,.85); border: 1px solid #3B2F7A; display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">BALANCE</span><span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px">1,250.00</span></div>
      </div>
    </div>
    <div style="font-size: 13px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">PRIZE TABLE · tap SPIN or swipe the wheel</div>
    <div style="border-radius: 14px; background: rgba(21,16,48,.85); border: 1px solid #3B2F7A; padding: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{prizes}}" as="p" hint-placeholder-count="8">
        <div style="height: 40px; border-radius: 8px; background: {{p.bg}}; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
          <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 12px; color: {{p.ink}}">{{p.name}}</span>
          <span style="font-size: 13px; font-weight: 700; color: {{p.ink}}; opacity: .9">{{p.val}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const JP = { GRAND: ['#E11D2E', '#FFFFFF'], MAJOR: ['#C026D3', '#FFFFFF'], MINOR: ['#2563EB', '#FFFFFF'], MINI: ['#0D9488', '#FFFFFF'] };
    const defs = [
      ['10×', 1, '#F5B301', '#0B0820'], ['15×', 1, '#5B21B6', '#FFFFFF'], ['MINI', 1, ...JP.MINI], ['25×', 1, '#F5B301', '#0B0820'],
      ['FREE SPINS', 1, '#0E7490', '#FFFFFF'], ['15×', 1, '#5B21B6', '#FFFFFF'], ['MINOR', 1, ...JP.MINOR], ['10×', 1, '#F5B301', '#0B0820'],
      ['50×', 1, '#FF7A1A', '#0B0820'], ['MAJOR', 1, ...JP.MAJOR], ['25×', 1, '#5B21B6', '#FFFFFF'], ['GRAND', 0.5, ...JP.GRAND]
    ];
    const total = defs.reduce((a, d) => a + d[1], 0);
    const R = 156, RI = 60; let a0 = -90;
    const toXY = (r, a) => [r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180)];
    const segs = defs.map(([label, w, fill, ink]) => {
      const a1 = a0 + 360 * w / total;
      const [x0, y0] = toXY(R, a0), [x1, y1] = toXY(R, a1), [xi0, yi0] = toXY(RI, a0), [xi1, yi1] = toXY(RI, a1);
      const mid = (a0 + a1) / 2; const [tx, ty] = toXY(112, mid);
      const seg = { d: `M${xi0} ${yi0} L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${xi1} ${yi1} A${RI} ${RI} 0 0 0 ${xi0} ${yi0} Z`, fill, ink, label, fs: label.length > 5 ? 10 : 15, tx: `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${(mid + 90).toFixed(1)})` };
      a0 = a1; return seg;
    });
    const bulbs = Array.from({ length: 24 }, (_, i) => { const [x, y] = toXY(168, i * 15); return { x: x.toFixed(1), y: y.toFixed(1), c: i % 2 ? '#FFE27A' : '#FF7A1A' }; });
    const prizes = [
      { name: '10× BET', val: '12.50', bg: '#3B2A05', ink: '#FFE27A' }, { name: '15× BET', val: '18.75', bg: '#3B2A05', ink: '#FFE27A' }, { name: '25× BET', val: '31.25', bg: '#3B2A05', ink: '#FFE27A' }, { name: '50× BET', val: '62.50', bg: '#5A2606', ink: '#FFB066' },
      { name: 'FREE SPINS', val: '10 spins ×2', bg: '#0A2A33', ink: '#A5F3FC' }, { name: 'MINI', val: '118.30', bg: 'linear-gradient(160deg,#0D9488,#065F46)', ink: '#FFFFFF' }, { name: 'MINOR', val: '1,204.55', bg: 'linear-gradient(160deg,#2563EB,#1E3A8A)', ink: '#FFFFFF' }, { name: 'MAJOR · GRAND', val: '12,481.90 · 152,384.27', bg: 'linear-gradient(90deg,#C026D3,#E11D2E)', ink: '#FFFFFF' }
    ];
    return { segs, bulbs, prizes };
  }
}
</script>
</body>
</html>
