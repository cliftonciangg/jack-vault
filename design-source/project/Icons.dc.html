<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jack Vault icon set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#A5F3FC}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; padding: 56px 64px; background: #0B0820; color: #FFFFFF; font-family: 'Rajdhani', 'Segoe UI', sans-serif; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 4px; color: #22D3EE; font-weight: 700">06 · ICONS</div>
      <h1 style="margin: 0; font-family: 'Orbitron', sans-serif; font-size: 40px; font-weight: 900">Aero line icons</h1>
    </div>
    <div style="font-size: 17px; color: #B9B3D9; max-width: 480px; text-align: right">24 px grid, 2 px stroke, mitred corners and diamond forms in place of circles. Draw at 24 px, show at 24 to 32 px, and keep a 48 px tap area.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{icons}}" as="ic" hint-placeholder-count="17">
      <div style="background: #151030; border: 1px solid {{ic.border}}; border-radius: 16px; height: 128px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: {{ic.shadow}}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{ic.stroke}}" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square" aria-hidden="true"><path d="{{ic.d}}"></path></svg>
        <span style="font-size: 15px; font-weight: 700; color: #B9B3D9">{{ic.name}}</span>
      </div>
    </sc-for>
    <div style="background: transparent; border: 1px dashed #3B2F7A; border-radius: 16px; height: 128px; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; gap: 6px">
      <span style="font-size: 15px; font-weight: 700">States</span>
      <span style="font-size: 14px; color: #B9B3D9; line-height: 1.35">White = idle · cyan + glow = active (turbo, autoplay) · #6B6690 = disabled</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Home', 'M3 11L12 3l9 8M6 9v12h12V9M10 21v-6h4v6'],
      ['Menu', 'M3 6h18M3 12h13M3 18h18'],
      ['Info', 'M12 2l10 10-10 10L2 12zM12 11v6M12 7v1'],
      ['Sound on', 'M3 9h4l6-5v16l-6-5H3zM16 8l2 4-2 4M19 5l3 7-3 7'],
      ['Sound off', 'M3 9h4l6-5v16l-6-5H3zM16 9l6 6M22 9l-6 6'],
      ['Settings', 'M12 2l8.5 5v10L12 22l-8.5-5V7zM12 9l3 3-3 3-3-3z'],
      ['Fullscreen', 'M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6'],
      ['Back', 'M15 4l-8 8 8 8'],
      ['Close', 'M5 5l14 14M19 5L5 19'],
      ['Coin', 'M12 3l7 3.5v11L12 21l-7-3.5v-11zM9.5 8.5h5l-3.5 7'],
      ['Gift', 'M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9L7 4 5 8zM12 9l5-5 2 4z'],
      ['Profile', 'M12 3l4 4-4 4-4-4zM4 21l3-7h10l3 7z'],
      ['Deposit', 'M12 3v11M7 9l5 5 5-5M4 17v4h16v-4'],
      ['History', 'M4 12a8 8 0 1 0 2.3-5.7M3 3v5h5M12 7v5l4 2'],
      ['Search', 'M10 3l7 7-7 7-7-7zM15 15l6 6'],
      ['Turbo', 'M13 2L4 14h7l-1 8 10-13h-7z', true],
      ['Autoplay', 'M4 12a8 8 0 0 1 14-5.3M18 3v4h-4M20 12a8 8 0 0 1-14 5.3M6 21v-4h4M10 9l5 3-5 3z', true]
    ];
    const icons = list.map(([name, d, active]) => ({
      name, d,
      stroke: active ? '#22D3EE' : '#FFFFFF',
      border: active ? '#22D3EE' : '#2E2560',
      shadow: active ? '0 0 18px rgba(34,211,238,.35)' : 'none'
    }));
    return { icons };
  }
}
</script>
</body>
</html>
