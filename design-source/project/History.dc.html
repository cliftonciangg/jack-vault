<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round history sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0820; font-family: 'Rajdhani', 'Segoe UI', sans-serif; color: #FFFFFF">
  <div style="position: absolute; left: 0; right: 0; top: 70px; bottom: 0; border-radius: 28px 28px 0 0; background: #151030; border-top: 1px solid #8B5CF6; display: flex; flex-direction: column; padding: 10px 16px 34px; box-sizing: border-box; gap: 10px">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #4B4766; margin: 0 auto 2px"></div>
    <div style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px">History</div>

    <!-- replay card for the selected round -->
    <div style="background: #1F1844; border: 1px solid #F5B301; border-radius: 14px; padding: 10px 12px; display: flex; gap: 12px; align-items: center">
      <div style="display: grid; grid-template-columns: repeat(5, 18px); gap: 2px; background: #0B0820; padding: 3px; border-radius: 6px">
        <sc-for list="{{replay}}" as="c" hint-placeholder-count="20"><span style="width: 18px; height: 18px; border-radius: 3px; background: {{c}}"></span></sc-for>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">REPLAY · ROUND 8F3A-21</span>
        <span style="font-size: 15px">Today 14:32 · Bet 1.25 · Line 7 ×3 Crown</span>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 16px; color: #FFE27A">WIN 12.50</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1.1fr 0.8fr 0.9fr 1.2fr; gap: 6px; padding: 0 12px; font-size: 12px; letter-spacing: 1px; font-weight: 700; color: #8A83AD"><span>TIME</span><span style="text-align: right">BET</span><span style="text-align: right">WIN</span><span style="text-align: right">ROUND ID</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
        <button style="display: grid; grid-template-columns: 1.1fr 0.8fr 0.9fr 1.2fr; gap: 6px; align-items: center; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid {{r.border}}; background: {{r.bg}}; color: #FFFFFF; text-align: left; font-size: 15px; font-variant-numeric: tabular-nums">
          <span>{{r.time}}</span>
          <span style="text-align: right; color: #B9B3D9">{{r.bet}}</span>
          <span style="text-align: right; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; color: {{r.winColor}}">{{r.win}}</span>
          <span style="text-align: right; color: #8A83AD; font-size: 13px">{{r.id}}</span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; color: #8A83AD; font-weight: 700">Tap a round to replay its final grid</span>
      <button aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; border: 2px solid #22D3EE; background: rgba(34,211,238,.12); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { CROWN: '#F5B301', GEM: '#8B5CF6', PLANET: '#0D9488', COMET: '#FF7A1A', A: '#F87171', K: '#22D3EE', Q: '#A78BFA', J: '#4ADE80', T: '#FBBF24', WILD: '#FFE27A', SCAT: '#22D3EE', BONUS: '#B87400' };
    const grid = [['A','CROWN','K','GEM'],['PLANET','Q','WILD','T'],['J','COMET','CROWN','BONUS'],['GEM','K','PLANET','Q'],['T','SCAT','J','CROWN']];
    const replay = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) replay.push(C[grid[c][r]]);
    const rows = [
      ['14:32', '1.25', '12.50', '8F3A-21', true], ['14:31', '1.25', '0.00', '8F3A-20'], ['14:31', '1.25', '2.50', '8F3A-19'], ['14:30', '1.25', '0.00', '8F3A-18'],
      ['14:29', '1.00', '186.25', '8F3A-17'], ['14:27', '1.00', '0.00', '8F3A-16'], ['14:27', '1.00', '1.00', '8F3A-15'], ['14:26', '1.00', '0.00', '8F3A-14'], ['14:25', '0.50', '0.00', '8F3A-13']
    ].map(([time, bet, win, id, sel]) => ({ time, bet, win, id, border: sel ? '#F5B301' : '#2E2560', bg: sel ? 'rgba(245,179,1,.08)' : '#1F1844', winColor: win === '0.00' ? '#8A83AD' : '#FFE27A' }));
    return { replay, rows };
  }
}
</script>
</body>
</html>
