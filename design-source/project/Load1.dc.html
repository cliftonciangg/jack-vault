<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crown of the Cosmos loading screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;family=Cinzel:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9B3D9}a:hover{color:#FFFFFF}
.gold{background:linear-gradient(180deg,#FFE27A 0%,#F5B301 55%,#B87400 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(245,179,1,.55))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 120% 60% at 50% 25%, #2A1F6B 0%, #130E36 45%, #06040F 100%); color: #FFFFFF; font-family: 'Rajdhani', 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 59px 24px 34px">
  <!-- star field (art placeholder) -->
  <svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0" aria-hidden="true">
    <g fill="#FFFFFF" opacity=".8"><circle cx="40" cy="120" r="1.5"></circle><circle cx="120" cy="60" r="1"></circle><circle cx="330" cy="90" r="1.5"></circle><circle cx="280" cy="200" r="1"></circle><circle cx="60" cy="300" r="1"></circle><circle cx="350" cy="330" r="2"></circle><circle cx="200" cy="420" r="1"></circle><circle cx="90" cy="520" r="1.5"></circle><circle cx="310" cy="560" r="1"></circle><circle cx="150" cy="650" r="1"></circle><circle cx="260" cy="720" r="1.5"></circle><circle cx="40" cy="760" r="1"></circle></g>
    <circle cx="320" cy="150" r="46" fill="#5B3FBF" opacity=".55"></circle>
    <ellipse cx="320" cy="150" rx="78" ry="14" fill="none" stroke="#22D3EE" stroke-width="2" opacity=".6" transform="rotate(-18 320 150)"></ellipse>
    <circle cx="60" cy="640" r="26" fill="#0D9488" opacity=".5"></circle>
  </svg>
  <div style="position: absolute; inset: 0; background: rgba(6,4,15,.35)"></div>

  <div style="position: relative; font-size: 13px; letter-spacing: 2px; color: #8A83AD; font-weight: 700">[FULL-BLEED THEME ART]</div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <svg width="96" height="60" viewBox="0 0 64 40" aria-hidden="true" style="filter: drop-shadow(0 0 12px rgba(245,179,1,.7))">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"></stop><stop offset=".6" stop-color="#F5B301"></stop><stop offset="1" stop-color="#B87400"></stop></linearGradient></defs>
      <path d="M4 34 L8 8 L20 22 L32 2 L44 22 L56 8 L60 34 Z" fill="url(#cg)"></path>
      <circle cx="32" cy="24" r="4" fill="#8B5CF6"></circle><circle cx="18" cy="28" r="2.5" fill="#22D3EE"></circle><circle cx="46" cy="28" r="2.5" fill="#22D3EE"></circle>
    </svg>
    <div class="gold" style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 54px; letter-spacing: 3px; line-height: 1">CROWN</div>
    <div style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 16px; letter-spacing: 8px; color: #C4B5FD">OF THE</div>
    <div class="gold" style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 54px; letter-spacing: 3px; line-height: 1">COSMOS</div>
  </div>

  <div style="position: relative; width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center">
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9"><span>LOADING</span><span style="font-family: 'Orbitron', sans-serif; color: #FFE27A">{{pct}}%</span></div>
      <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); border: 1px solid #3B2F7A; overflow: hidden">
        <div style="height: 100%; width: {{pctW}}; background: linear-gradient(90deg,#B87400,#F5B301,#FFE27A); box-shadow: 0 0 12px rgba(245,179,1,.7)"></div>
      </div>
    </div>
    <div style="font-size: 16px; color: #B9B3D9; text-align: center; line-height: 1.35">Land 3 Scatters to unlock Free Spins</div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="display: flex; align-items: baseline; gap: 6px; transform: skewX(-12deg)">
      <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px; color: #FFFFFF">JACK</span>
      <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; color: #F5B301">VAULT</span>
    </div>
    <div style="font-size: 14px; color: #8A83AD; display: flex; gap: 12px"><span>v1.0.0</span><a href="#" style="text-decoration: underline">Play responsibly</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","default":62,"min":0,"max":100,"step":1,"unit":"%"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.progress ?? 62;
    return { pct: p, pctW: p + '%' };
  }
}
</script>
</body>
</html>
