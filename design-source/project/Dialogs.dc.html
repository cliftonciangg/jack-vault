<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System dialogs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1250px; height: 1120px; box-sizing: border-box; padding: 40px 48px; background: #0B0820; color: #FFFFFF; font-family: 'Rajdhani', 'Segoe UI', sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 4px; color: #22D3EE; font-weight: 700">P10 · DIALOGS</div>
      <h1 style="margin: 0; font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900">System states</h1>
    </div>
    <div style="font-size: 16px; color: #B9B3D9; max-width: 560px; text-align: right">Each card is the dialog at its phone-portrait width (342 px) over a dimmed screen. Buttons sit at the bottom, full width, primary action last. Modal pop-in 160 + 240 ms.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex: 1; align-content: start">
    <sc-for list="{{dialogs}}" as="d" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; letter-spacing: 1.5px; font-weight: 700; color: #8A83AD">{{d.k}}</span>
        <div style="background: rgba(11,8,32,.9); border: 1px solid #241C4F; border-radius: 18px; padding: 16px; display: flex; align-items: {{d.align}}; justify-content: center; min-height: 290px">
          <div style="width: 342px; background: rgba(31,24,68,.96); border: 1px solid {{d.border}}; border-radius: {{d.radius}}; box-shadow: 0 0 40px {{d.glow}}, inset 0 1px 0 rgba(255,255,255,.08); padding: 22px 18px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; position: relative">
            <sc-if value="{{d.sheet}}" hint-placeholder-val="{{false}}"><span style="width: 40px; height: 5px; border-radius: 3px; background: #4B4766; margin-top: -10px"></span></sc-if>
            <div style="width: 52px; height: 52px; border-radius: 26px; background: {{d.iconBg}}; display: flex; align-items: center; justify-content: center">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{d.iconInk}}" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="transform: rotate({{d.rot}})"><path d="{{d.icon}}"></path></svg>
            </div>
            <div style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 18px; line-height: 1.2">{{d.title}}</div>
            <div style="font-size: 16px; color: #B9B3D9; line-height: 1.35">{{d.body}}</div>
            <sc-if value="{{d.extra}}" hint-placeholder-val="{{false}}"><div style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; color: {{d.extraColor}}; letter-spacing: 1px">{{d.extra}}</div></sc-if>
            <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px">
              <sc-if value="{{d.secondary}}" hint-placeholder-val="{{true}}"><button style="height: 50px; border-radius: 25px; border: 2px solid #22D3EE; background: transparent; color: #22D3EE; font-weight: 700; font-size: 16px; letter-spacing: 1px">{{d.secondary}}</button></sc-if>
              <button style="height: 50px; border-radius: 25px; border: 0; background: {{d.primaryBg}}; color: {{d.primaryInk}}; font-weight: 700; font-size: 16px; letter-spacing: 1px; box-shadow: 0 0 18px {{d.glow}}">{{d.primary}}</button>
            </div>
            <sc-if value="{{d.dismiss}}" hint-placeholder-val="{{false}}"><button aria-label="Dismiss" style="position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A83AD" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button></sc-if>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1250,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const gold = 'linear-gradient(180deg,#FFE27A,#F5B301 60%,#D99A00)', violet = '#7C3AED';
    const base = { align: 'center', radius: '22px', sheet: false, dismiss: false, rot: '0deg', extra: '', extraColor: '#B9B3D9', primaryInk: '#FFFFFF', border: '#8B5CF6', glow: 'rgba(139,92,246,.35)', iconBg: 'rgba(139,92,246,.16)', iconInk: '#C4B5FD' };
    const dialogs = [
      { ...base, k: '1 · INSUFFICIENT BALANCE', title: 'Not enough coins', body: 'Your balance is lower than this bet. Lower the bet or add coins to keep playing.', icon: 'M12 3l7 3.5v11L12 21l-7-3.5v-11zM9.5 8.5h5l-3.5 7', iconBg: 'rgba(245,179,1,.14)', iconInk: '#F5B301', border: '#F5B301', glow: 'rgba(245,179,1,.35)', secondary: 'LOWER BET', primary: 'GET COINS', primaryBg: gold, primaryInk: '#0B0820' },
      { ...base, k: '2 · CONNECTION LOST', title: 'Reconnecting…', body: 'We lost the connection for a moment. Your round is safe and will resume.', icon: 'M20 12a8 8 0 1 1-2.6-5.9M20 3.5v4.5h-4.5', rot: '40deg', iconInk: '#22D3EE', iconBg: 'rgba(34,211,238,.14)', border: '#22D3EE', glow: 'rgba(34,211,238,.3)', extra: 'RETRY APPEARS AFTER 10 S', extraColor: '#8A83AD', secondary: '', primary: 'RETRY NOW', primaryBg: violet },
      { ...base, k: '3 · ROUND RESUMED', title: 'Welcome back!', body: 'We restored your unfinished Free Spins. You have 6 spins left with all wins ×2.', icon: 'M12 2l2.5 7h7l-5.6 4.2 2.1 7L12 16l-6 4.2 2.1-7L2.5 9h7z', iconInk: '#A5F3FC', iconBg: 'rgba(34,211,238,.14)', border: '#22D3EE', glow: 'rgba(34,211,238,.3)', secondary: '', primary: 'CONTINUE', primaryBg: gold, primaryInk: '#0B0820' },
      { ...base, k: '4 · SESSION EXPIRED', title: 'Please log in again', body: 'Your session timed out after 30 minutes without activity. Your balance is unchanged.', icon: 'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4', secondary: '', primary: 'LOG IN', primaryBg: violet },
      { ...base, k: '5 · GENERIC ERROR', title: 'Something went wrong', body: 'The game could not continue. If this keeps happening, contact support and quote the code below.', icon: 'M12 2l10 10-10 10L2 12zM12 8v5M12 16h.01', iconInk: '#F87171', iconBg: 'rgba(239,68,68,.14)', border: '#EF4444', glow: 'rgba(239,68,68,.3)', extra: 'ERROR CODE  E-4102', extraColor: '#F87171', secondary: '', primary: 'BACK TO LOBBY', primaryBg: violet },
      { ...base, k: '6 · LEAVE DURING FEATURE', title: 'Leave the game?', body: 'You are in Free Spins. Your bonus will be saved and you can finish it next time.', icon: 'M15 4l-8 8 8 8', secondary: 'STAY', primary: 'LEAVE', primaryBg: '#2E1F6B' },
      { ...base, k: '7 · DAILY BONUS', title: 'Daily bonus!', body: 'Come back every day for a bigger reward. Day 3 of 7.', icon: 'M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9L7 4 5 8zM12 9l5-5 2 4z', iconInk: '#F5B301', iconBg: 'rgba(245,179,1,.14)', border: '#F5B301', glow: 'rgba(245,179,1,.45)', extra: '+ 250.00 COINS', extraColor: '#FFE27A', secondary: '', primary: 'CLAIM', primaryBg: gold, primaryInk: '#0B0820' },
      { ...base, k: '8 · ROTATE HINT · dismissible', title: 'Turn your phone', body: 'Landscape gives you a bigger reel view. This is optional.', icon: 'M7 2h10v20H7zM11 19h2', rot: '-70deg', dismiss: true, secondary: '', primary: 'GOT IT', primaryBg: '#2E1F6B' },
      { ...base, k: '9 · ADD TO HOME SCREEN · bottom sheet', align: 'flex-end', radius: '22px 22px 0 0', sheet: true, title: 'Install Jack Vault', body: 'Add it to your home screen for full-screen play and faster loading.', icon: 'M12 3v11M7 9l5 5 5-5M4 17v4h16v-4', iconInk: '#F5B301', iconBg: 'rgba(245,179,1,.14)', border: '#F5B301', glow: 'rgba(245,179,1,.3)', secondary: 'NOT NOW', primary: 'ADD TO HOME SCREEN', primaryBg: gold, primaryInk: '#0B0820' }
    ];
    return { dialogs };
  }
}
</script>
</body>
</html>
