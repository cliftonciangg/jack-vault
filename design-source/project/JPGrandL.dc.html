<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grand jackpot win, landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.gold{background:linear-gradient(180deg,#FFF3E0 0%,#FFE27A 30%,#F5B301 65%,#B87400 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(245,179,1,.8))}
</style>
</helmet>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; font-family: 'Rajdhani', 'Segoe UI', sans-serif; color: #FFFFFF">
  <dc-import name="ReelsL" hint-size="844px,390px"></dc-import>
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(225,29,46,.45), rgba(6,4,15,.92) 70%); border: 6px solid #F5B301; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 20px 75px 21px">
    <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; inset: 0" aria-hidden="true">
      <g transform="translate(422 195)" opacity=".4">
        <sc-for list="{{rays}}" as="r" hint-placeholder-count="16"><path d="M0 0 L-24 -600 L24 -600 Z" fill="{{r.c}}" transform="rotate({{r.a}})"></path></sc-for>
      </g>
      <sc-for list="{{fw}}" as="f" hint-placeholder-count="4">
        <g transform="translate({{f.x}} {{f.y}})" stroke="{{f.c}}" stroke-width="2" opacity=".9" fill="none"><path d="M0 0L0 -30M0 0L21 -21M0 0L30 0M0 0L21 21M0 0L0 30M0 0L-21 21M0 0L-30 0M0 0L-21 -21"></path><circle r="34" stroke-dasharray="3 9"></circle></g>
      </sc-for>
    </svg>
    <sc-for list="{{coins}}" as="c" hint-placeholder-count="30">
      <span style="position: absolute; left: {{c.x}}; top: {{c.y}}; width: {{c.s}}; height: {{c.s}}; border-radius: 50%; background: linear-gradient(160deg,#FFE27A,#F5B301 55%,#B87400); box-shadow: 0 0 8px rgba(245,179,1,.6); transform: rotate({{c.r}}) scaleX(.6)"></span>
    </sc-for>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <svg width="80" height="50" viewBox="0 0 64 40" aria-hidden="true" style="filter: drop-shadow(0 0 14px rgba(245,179,1,.9))"><path d="M4 34 L8 8 L20 22 L32 2 L44 22 L56 8 L60 34 Z" fill="#FFE27A"></path><circle cx="32" cy="24" r="4" fill="#FFFFFF" opacity=".8"></circle></svg>
      <div style="width: 300px; padding: 18px 0; border-radius: 22px; background: linear-gradient(160deg,#FFC94A,#E11D2E 55%,#7A0A14); border: 3px solid #FFE27A; box-shadow: 0 0 0 3px #E11D2E, 0 0 60px rgba(225,29,46,.9); display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 50px; letter-spacing: 3px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.4)">GRAND</span>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 6px; opacity: .9">JACKPOT</span>
      </div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 3px; color: #FFE27A; text-shadow: 0 0 20px rgba(245,179,1,.9)">GRAND JACKPOT!</div>
      <div class="gold" style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums">152,384.27</div>
      <button style="width: 260px; height: 54px; border-radius: 27px; border: 0; background: linear-gradient(180deg,#FFE27A,#F5B301 60%,#D99A00); color: #0B0820; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: 2px; box-shadow: 0 0 28px rgba(245,179,1,.6)">COLLECT</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const rays = Array.from({ length: 16 }, (_, i) => ({ a: i * 22.5, c: i % 2 ? '#F5B301' : '#E11D2E' }));
    const fw = [{ x: 120, y: 70, c: '#22D3EE' }, { x: 720, y: 60, c: '#F0ABFC' }, { x: 100, y: 320, c: '#FFE27A' }, { x: 740, y: 330, c: '#FF7A1A' }];
    const coins = Array.from({ length: 30 }, (_, i) => ({ x: (70 + (i * 83) % 720) + 'px', y: (20 + ((i * 71) % 340)) + 'px', s: (8 + (i % 5) * 4) + 'px', r: ((i * 137.5) % 360) + 'deg' }));
    return { rays, fw, coins };
  }
}
</script>
</body>
</html>
