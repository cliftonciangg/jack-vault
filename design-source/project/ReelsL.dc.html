<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crown of the Cosmos reels, landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@500;600;700&amp;family=Cinzel:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#A5F3FC}
button{font:inherit;cursor:pointer}
.gold{background:linear-gradient(180deg,#FFE27A 0%,#F5B301 55%,#B87400 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: {{rootBg}}; color: #FFFFFF; font-family: 'Rajdhani', 'Segoe UI', sans-serif; display: flex; gap: 10px; padding: 10px 70px 21px 70px">
  <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; inset: 0" aria-hidden="true">
    <g fill="#FFFFFF" opacity=".7"><circle cx="30" cy="60" r="1.5"></circle><circle cx="140" cy="300" r="1"></circle><circle cx="800" cy="80" r="1.5"></circle><circle cx="700" cy="340" r="1"></circle></g>
    <circle cx="780" cy="200" r="30" fill="#5B3FBF" opacity=".4"></circle>
  </svg>

  <!-- LEFT: logo + jackpots + bonus -->
  <div style="position: relative; width: 118px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 4px 0">
      <span class="gold" style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; letter-spacing: 1px">CROWN</span>
      <span style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 8px; letter-spacing: 4px; color: #C4B5FD">OF THE</span>
      <span class="gold" style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; letter-spacing: 1px">COSMOS</span>
    </div>
    <sc-for list="{{jackpots}}" as="j" hint-placeholder-count="4">
      <div style="height: 34px; border-radius: 8px; background: {{j.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1">
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 9px">{{j.name}}</span>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px; color: #FFE27A">{{j.amt}}</span>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <div style="height: 40px; border-radius: 10px; background: rgba(21,16,48,.8); border: 1px solid #F5B301; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1">
      <span style="font-size: 11px; letter-spacing: 1px; font-weight: 700; color: #FFE27A">3 BONUS =</span>
      <span style="font-size: 12px; letter-spacing: 1px; font-weight: 700; color: #FFE27A">SUPER WHEEL</span>
    </div>
  </div>

  <!-- CENTER: reels + message + strip -->
  <div style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
    <div style="flex: 1; border-radius: 14px; padding: 6px 12px; background: linear-gradient(180deg,#3B2A05,#1A1203); border: 2px solid #F5B301; box-shadow: {{frameGlow}}; position: relative; display: flex">
      <div style="position: absolute; left: 2px; top: 8px; bottom: 8px; display: flex; flex-direction: column; justify-content: space-between">
        <sc-for list="{{linesL}}" as="l" hint-placeholder-count="13"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{l.c}}"></span></sc-for>
      </div>
      <div style="position: absolute; right: 2px; top: 8px; bottom: 8px; display: flex; flex-direction: column; justify-content: space-between">
        <sc-for list="{{linesR}}" as="l" hint-placeholder-count="12"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{l.c}}"></span></sc-for>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: #0B0820; border-radius: 10px; padding: 4px">
        <sc-for list="{{cols}}" as="col" hint-placeholder-count="5">
          <div style="display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 3px; border-radius: 7px; background: #151030; padding: 2px">
            <sc-for list="{{col.cells}}" as="c" hint-placeholder-count="4">
              <div style="border-radius: 6px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 0">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="{{c.fill}}" stroke="{{c.ink}}" stroke-width="1.6" stroke-linejoin="miter" aria-hidden="true"><path d="{{c.d}}"></path></svg>
                <span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 8px; color: {{c.ink}}">{{c.label}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="height: 20px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: {{msgColor}}">{{msg}}</div>
    <div style="height: 54px; border-radius: 16px; background: rgba(21,16,48,.85); border: 1px solid #3B2F7A; display: flex; align-items: center; gap: 6px; padding: 0 8px">
      <button aria-label="Menu" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3B2F7A; background: #1F1844; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 6h18M3 12h13M3 18h18"></path></svg></button>
      <button aria-label="Info" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3B2F7A; background: #1F1844; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12zM12 11v6M12 7v1"></path></svg></button>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: rgba(11,8,32,.8); border: 1px solid #3B2F7A; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1"><span style="font-size: 10px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">BALANCE</span><span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 16px">1,250.00</span></div>
      <button aria-label="Decrease bet" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2E1F6B; color: #FFFFFF; font-size: 24px; font-weight: 700; padding: 0">−</button>
      <div style="width: 84px; height: 44px; border-radius: 10px; background: rgba(11,8,32,.8); border: 1px solid {{betBorder}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1"><span style="font-size: 10px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">{{betLabel}}</span><span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 16px; color: {{betColor}}">{{betValue}}</span></div>
      <button aria-label="Increase bet" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #7C3AED; color: #FFFFFF; font-size: 24px; font-weight: 700; padding: 0">+</button>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: rgba(11,8,32,.8); border: 1px solid {{winBorder}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1"><span style="font-size: 10px; letter-spacing: 1.5px; font-weight: 700; color: #B9B3D9">{{winLabel}}</span><span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 16px; color: #F5B301">{{winValue}}</span></div>
      <button aria-label="Turbo" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3B2F7A; background: #1F1844; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="miter" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 10-13h-7z"></path></svg></button>
      <button aria-label="Autoplay" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3B2F7A; background: #1F1844; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M18 3v4h-4M20 12a8 8 0 0 1-14 5.3M6 21v-4h4M10 9l5 3-5 3z"></path></svg></button>
    </div>
  </div>

  <!-- RIGHT: SPIN under right thumb -->
  <div style="position: relative; width: 110px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
    <sc-if value="{{isFS}}" hint-placeholder-val="{{false}}">
      <div style="width: 104px; height: 104px; border-radius: 52px; border: 4px solid #22D3EE; background: radial-gradient(circle at 40% 30%, #1E3A8A 0%, #130E36 70%); box-shadow: 0 0 30px rgba(34,211,238,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 1px; color: #A5F3FC">AUTO</span>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 30px; color: #FFFFFF; line-height: 1">6</span>
        <span style="font-size: 10px; letter-spacing: 1px; font-weight: 700; color: #A5F3FC">SPINS LEFT</span>
      </div>
      <span style="font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: #A5F3FC">ALL WINS ×2</span>
    </sc-if>
    <sc-if value="{{isBase}}" hint-placeholder-val="{{true}}">
      <button aria-label="Spin, hold for autoplay" style="width: 104px; height: 104px; border-radius: 52px; border: 4px solid #F5B301; background: radial-gradient(circle at 40% 30%, #FFD3A3 0%, #FF7A1A 55%, #C2410C 100%); box-shadow: 0 0 0 6px rgba(255,122,26,.18), 0 0 36px rgba(255,122,26,.65); display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#0B0820" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 3.5v4.5h-4.5"></path></svg>
      </button>
      <span style="font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: #FFB066">HOLD FOR AUTO</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fs":{"editor":"boolean","default":false},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      CROWN: { d: 'M3 18L4 7l5 5 3-8 3 8 5-5 1 11z', fill: '#F5B301', ink: '#FFE27A', bg: 'radial-gradient(circle at 50% 30%, #3B2A05, #1A1203)', label: 'CROWN' },
      GEM: { d: 'M12 3l7 6-7 12-7-12z M5 9h14', fill: '#8B5CF6', ink: '#C4B5FD', bg: 'radial-gradient(circle at 50% 30%, #2E1F6B, #130E36)', label: 'GEM' },
      PLANET: { d: 'M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M2 14c6 3 14 3 20 0', fill: '#0D9488', ink: '#F5B301', bg: 'radial-gradient(circle at 50% 30%, #064E3B, #06241C)', label: 'PLANET' },
      COMET: { d: 'M15 9a4 4 0 1 1 0 .1z M15 9L3 21 M12 7L2 15 M17 12L9 22', fill: '#FF7A1A', ink: '#FFB066', bg: 'radial-gradient(circle at 50% 30%, #5A2606, #2A1003)', label: 'COMET' },
      A: { d: 'M5 20L12 4l7 16M8 14h8', fill: 'none', ink: '#F87171', bg: '#2A0F14', label: 'A' },
      K: { d: 'M6 4v16M18 4l-9 8 9 8', fill: 'none', ink: '#22D3EE', bg: '#0A2A33', label: 'K' },
      Q: { d: 'M12 4a7 8 0 1 0 0 16 7 8 0 0 0 0-16zM14 16l5 5', fill: 'none', ink: '#A78BFA', bg: '#1E1450', label: 'Q' },
      J: { d: 'M15 4v11a4 4 0 0 1-8 0', fill: 'none', ink: '#4ADE80', bg: '#0A2A1A', label: 'J' },
      T: { d: 'M5 6v12M9 6h6M12 6v12M18 6a3 6 0 1 0 0 12 3 6 0 0 0 0-12z', fill: 'none', ink: '#FBBF24', bg: '#2A2005', label: '10' },
      WILD: { d: 'M12 2l2.5 7h7l-5.6 4.2 2.1 7L12 16l-6 4.2 2.1-7L2.5 9h7z', fill: '#FFE27A', ink: '#FFFFFF', bg: 'radial-gradient(circle at 50% 30%, #7C3AED, #2E1065)', label: 'WILD' },
      SCAT: { d: 'M12 12a5 5 0 1 0 .1 0z M12 2a10 10 0 0 1 10 10 M12 22A10 10 0 0 1 2 12', fill: '#22D3EE', ink: '#A5F3FC', bg: 'radial-gradient(circle at 50% 30%, #0E7490, #0A2A33)', label: 'FREE' },
      BONUS: { d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18M3 12h18M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', fill: '#B87400', ink: '#FFE27A', bg: 'radial-gradient(circle at 50% 30%, #3B2A05, #1A1203)', label: 'BONUS' }
    };
    const grid = [['A','CROWN','K','GEM'],['PLANET','Q','WILD','T'],['J','COMET','A','BONUS'],['GEM','K','PLANET','Q'],['T','SCAT','J','CROWN']];
    const cols = grid.map(names => ({ cells: names.map(n => S[n]) }));
    const lineColors = ['#F5B301','#22D3EE','#A78BFA','#4ADE80','#FF7A1A','#F87171','#FBBF24','#F0ABFC','#67E8F9','#6EE7B7'];
    const lines = Array.from({ length: 25 }, (_, i) => ({ n: i + 1, c: lineColors[i % lineColors.length] }));
    const jackpots = [
      { name: 'GRAND', amt: '152,384.27', bg: 'linear-gradient(160deg,#FFC94A,#E11D2E 55%,#7A0A14)' },
      { name: 'MAJOR', amt: '12,481.90', bg: 'linear-gradient(160deg,#F0ABFC,#C026D3 50%,#6D28D9)' },
      { name: 'MINOR', amt: '1,204.55', bg: 'linear-gradient(160deg,#67E8F9,#2563EB 50%,#1E3A8A)' },
      { name: 'MINI', amt: '118.30', bg: 'linear-gradient(160deg,#6EE7B7,#0D9488 50%,#065F46)' }
    ];
    const fs = !!this.props.fs;
    return { cols, jackpots, linesL: lines.slice(0, 13), linesR: lines.slice(13),
      isFS: fs, isBase: !fs,
      rootBg: fs ? 'radial-gradient(ellipse 60% 120% at 50% 30%, #1E3A8A 0%, #1E1450 45%, #06040F 100%)' : 'radial-gradient(ellipse 60% 120% at 50% 30%, #2A1F6B 0%, #130E36 50%, #06040F 100%)',
      frameGlow: fs ? '0 0 0 2px #22D3EE, 0 0 34px rgba(34,211,238,.7)' : '0 0 0 1px #8B5CF6, 0 0 22px rgba(139,92,246,.45)',
      msg: fs ? 'FREE SPIN 4 OF 10' : 'GOOD LUCK!', msgColor: fs ? '#A5F3FC' : '#B9B3D9',
      betLabel: fs ? 'FREE SPINS' : 'BET', betValue: fs ? '4 / 10' : '1.25', betColor: fs ? '#A5F3FC' : '#FFE27A', betBorder: fs ? '#22D3EE' : '#3B2F7A',
      winLabel: fs ? 'TOTAL WIN' : 'WIN', winValue: fs ? '86.25' : '0.00', winBorder: fs ? '#F5B301' : '#3B2F7A' };
  }
}
</script>
</body>
</html>
