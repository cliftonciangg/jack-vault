<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Back office shell on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A78B4}a:hover{color:#166FA3}
button,input,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #111827; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden; position: relative; padding-top: 59px">
  <!-- top bar -->
  <div style="height: 56px; flex-shrink: 0; background: #1B2B44; color: #FFFFFF; display: flex; align-items: center; padding: 0 12px; gap: 10px">
    <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
    <span style="font-weight: 600; font-size: 15px; flex: 1">User Management</span>
    <span style="height: 20px; padding: 0 8px; border-radius: 4px; background: #0F766E; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 1px; display: inline-flex; align-items: center">AGENT</span>
  </div>
  <div style="height: 36px; flex-shrink: 0; background: #FFF8E6; border-bottom: 1px solid #F1E3B8; display: flex; align-items: center; padding: 0 16px; gap: 8px">
    <span style="color: #4B5563">Balance:</span><span style="color: #1A78B4; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums">12,450.00</span>
    <button aria-label="Refresh balance" style="width: 28px; height: 28px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A78B4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg></button>
    <span style="flex: 1"></span><span style="color: #4B5563; font-size: 12px">EST</span>
  </div>
  <!-- content: search + card list -->
  <div style="flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="display: flex; gap: 8px">
      <input placeholder="Username or ID" style="height: 44px; flex: 1; border: 1px solid #D1D5DB; border-radius: 6px; padding: 0 12px; font-size: 15px; min-width: 0">
      <button style="height: 44px; border-radius: 6px; border: 0; background: #1A78B4; color: #FFFFFF; font-weight: 600; padding: 0 14px">Search</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #4B5563"><span>48 players</span><a href="#" style="font-weight: 600; text-decoration: none">+ Create Player</a></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-weight: 600; font-size: 15px">{{r.user}}</span>
          <span style="height: 20px; padding: 0 8px; border-radius: 10px; background: {{r.pillBg}}; color: {{r.pillInk}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">{{r.status}}</span>
          <span style="flex: 1"></span>
          <span style="font-variant-numeric: tabular-nums; font-weight: 600">{{r.bal}}</span>
          <button aria-label="More actions" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #D1D5DB; background: #FFFFFF; color: #4B5563; font-weight: 700; padding: 0">…</button>
        </div>
        <div style="display: flex; gap: 8px">
          <button style="flex: 1; height: 44px; border-radius: 6px; border: 0; background: #15803D; color: #FFFFFF; font-weight: 600; font-size: 15px">Load</button>
          <button style="flex: 1; height: 44px; border-radius: 6px; border: 1px solid #DC2626; background: #FFFFFF; color: #DC2626; font-weight: 600; font-size: 15px">Redeem</button>
        </div>
      </div>
    </sc-for>
  </div>
  <!-- drawer (open) -->
  <div style="position: absolute; inset: 0; background: rgba(17,24,39,.45)"></div>
  <nav style="position: absolute; left: 0; top: 0; bottom: 0; width: 280px; background: #E9EDF2; display: flex; flex-direction: column; padding: 59px 12px 34px">
    <div style="height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 4px; color: #111827">
      <span style="font-weight: 700; font-size: 15px">Jack Vault</span><span style="color: #4B5563; font-size: 13px">agent01</span>
      <button aria-label="Close menu" style="margin-left: auto; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
        <a href="{{m.href}}" style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; background: {{m.bg}}; color: {{m.ink}}; text-decoration: none; font-weight: {{m.weight}}; border-left: 3px solid {{m.edge}}; box-sizing: border-box; font-size: 15px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{m.ink}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>{{m.label}}
        </a>
      </sc-for>
    </div>
    <a href="Login.dc.html" style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; background: #FFFFFF; color: #4B5563; text-decoration: none; font-size: 15px">Log out</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = { dash: 'M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z', users: 'M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 5a3 3 0 0 1 0 6M22 20a6 6 0 0 0-5-6', records: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', game: 'M6 9h12a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4c-2 0-3-2-4-2h-4c-1 0-2 2-4 2a4 4 0 0 1-4-4v-2a4 4 0 0 1 4-4zM7 12v4M5 14h4M16 13h.01M18 15h.01', settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM4 12h2M18 12h2M12 4v2M12 18v2' };
    const menu = [['Dashboard', 'dash', 'AgentDashPhone.dc.html'], ['User Management', 'users', 'UsersPhone.dc.html'], ['Transaction Records', 'records', 'TransactionsPhone.dc.html'], ['Game Records', 'game', 'GameRecords.dc.html'], ['Settings', 'settings', 'Settings.dc.html']].map(([label, ic, href]) => { const on = label === 'User Management'; return { label, href, d: I[ic], bg: on ? '#E3F0FA' : '#FFFFFF', ink: on ? '#166FA3' : '#111827', weight: on ? 600 : 500, edge: on ? '#1A78B4' : 'transparent' }; });
    const P = { Active: ['#DCFCE7', '#15803D'], Disabled: ['#E5E7EB', '#4B5563'], Locked: ['#FEF3C7', '#B45309'] };
    const rows = [['player123', '75.00', 'Active'], ['lucky_amy', '1,204.55', 'Active'], ['bing_rao', '0.00', 'Locked'], ['sita.k', '2,232.95', 'Active']].map(([user, bal, status]) => ({ user, bal, status, pillBg: P[status][0], pillInk: P[status][1] }));
    return { menu, rows };
  }
}
</script>
</body>
</html>
