<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent dashboard on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A78B4}a:hover{color:#166FA3}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; color: #111827; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden; padding-top: 59px">
  <div style="height: 56px; flex-shrink: 0; background: #1B2B44; color: #FFFFFF; display: flex; align-items: center; padding: 0 12px; gap: 10px">
    <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
    <span style="font-weight: 600; font-size: 15px; flex: 1">Dashboard</span>
    <span style="height: 20px; padding: 0 8px; border-radius: 4px; background: #0F766E; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 1px; display: inline-flex; align-items: center">AGENT</span>
  </div>
  <div style="height: 36px; flex-shrink: 0; background: #FFF8E6; border-bottom: 1px solid #F1E3B8; display: flex; align-items: center; padding: 0 16px; gap: 8px">
    <span style="color: #4B5563">Balance:</span><span style="color: #1A78B4; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums">12,450.00</span>
    <span style="flex: 1"></span><span style="color: #4B5563; font-size: 12px">EST</span>
  </div>
  <div style="flex: 1; padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{shortcuts}}" as="s" hint-placeholder-count="5"><button style="height: 32px; border-radius: 6px; border: 0; background: {{s.bg}}; color: #FFFFFF; font-weight: {{s.w}}; font-size: 13px; padding: 0 10px; white-space: nowrap">{{s.label}}</button></sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #4B5563; font-weight: 500">{{s.label}}</span>
          <span style="font-size: 20px; font-weight: 600; color: {{s.color}}; font-variant-numeric: tabular-nums">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center">
      <sc-for list="{{small}}" as="s" hint-placeholder-count="4"><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{s.value}}</span><span style="font-size: 11px; color: #4B5563">{{s.label}}</span></div></sc-for>
    </div>
    <div style="display: flex; gap: 8px">
      <input placeholder="Find player" style="height: 44px; flex: 1; border: 1px solid #D1D5DB; border-radius: 6px; padding: 0 12px; font-size: 15px; min-width: 0; background: #FFFFFF">
      <button style="height: 44px; border-radius: 6px; border: 0; background: #15803D; color: #FFFFFF; font-weight: 600; padding: 0 14px">Load</button>
      <button style="height: 44px; border-radius: 6px; border: 1px solid #DC2626; background: #FFFFFF; color: #DC2626; font-weight: 600; padding: 0 12px">Redeem</button>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #E5E7EB"><span style="font-size: 15px; font-weight: 600; color: #1A78B4">Recent activity</span><a href="TransactionsPhone.dc.html" style="font-size: 13px; font-weight: 500">View all</a></div>
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-top: 1px solid #F3F4F6; font-variant-numeric: tabular-nums">
          <span style="height: 20px; padding: 0 7px; border-radius: 4px; background: {{r.pillBg}}; color: {{r.pillInk}}; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; width: 48px; justify-content: center">{{r.type}}</span>
          <span style="font-weight: 500; flex: 1">{{r.player}}</span>
          <span style="color: #6B7280; font-size: 12px">{{r.time}}</span>
          <span style="color: {{r.pillInk}}; font-weight: 600; width: 76px; text-align: right">{{r.amt}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const shortcuts = ['Today', 'Yesterday', 'This Week', 'Last Week', 'This Month'].map((label, i) => ({ label, bg: i === 0 ? '#166FA3' : '#1A78B4', w: i === 0 ? 600 : 500 }));
    const stats = [{ label: 'My balance', value: '12,450.00', color: '#111827' }, { label: 'Loaded today', value: '1,870.00', color: '#15803D' }, { label: 'Redeemed today', value: '640.00', color: '#DC2626' }, { label: 'Net today', value: '+1,230.00', color: '#111827' }];
    const small = [{ label: 'Players', value: '48' }, { label: 'Active', value: '44' }, { label: 'Disabled', value: '4' }, { label: 'Their balance', value: '9,812' }];
    const recent = [['15:48', 'LOAD', 'anil.m', '+150.00'], ['15:31', 'LOAD', 'dev_k', '+20.00'], ['15:10', 'REDEEM', 'pooja_s', '−300.00'], ['14:55', 'LOAD', 'sita.k', '+100.00'], ['14:02', 'LOAD', 'player123', '+50.00'], ['13:40', 'REDEEM', 'lucky_amy', '−120.00'], ['12:18', 'LOAD', 'nita_09', '+200.00']].map(([time, type, player, amt]) => ({ time, type, player, amt, pillBg: type === 'LOAD' ? '#DCFCE7' : '#FEE2E2', pillInk: type === 'LOAD' ? '#15803D' : '#DC2626' }));
    return { shortcuts, stats, small, recent };
  }
}
</script>
</body>
</html>
