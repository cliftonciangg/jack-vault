<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jack Vault 777 loading screen, landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; position: relative; overflow: hidden; background: #070418; color: #FFFFFF; font-family: 'Rajdhani', 'Segoe UI', sans-serif">
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 45% 70% at 28% 45%, rgba(124,58,237,.55) 0%, rgba(124,58,237,0) 70%), radial-gradient(ellipse 35% 60% at 88% 15%, rgba(34,211,238,.22) 0%, rgba(34,211,238,0) 70%), radial-gradient(ellipse 40% 70% at 70% 90%, rgba(219,39,119,.28) 0%, rgba(219,39,119,0) 70%), linear-gradient(180deg, #0B0624 0%, #120A38 50%, #0A0520 100%)"></div>
  <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; inset: 0" aria-hidden="true">
    <defs>
      <radialGradient id="jvl-far" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9AF5FF"></stop><stop offset=".45" stop-color="#1FA6C9"></stop><stop offset="1" stop-color="#0A2A4A"></stop></radialGradient>
      <linearGradient id="jvl-comet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="1" stop-color="#FFF3C4" stop-opacity=".9"></stop></linearGradient>
      <radialGradient id="jvl-halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFD23A" stop-opacity=".30"></stop><stop offset=".5" stop-color="#8B5CF6" stop-opacity=".16"></stop><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"></stop></radialGradient>
    </defs>
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="70"><circle cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" fill="#FFFFFF" opacity="{{s.o}}"></circle></sc-for>
    <circle cx="800" cy="44" r="46" fill="url(#jvl-far)" opacity=".85"></circle>
    <ellipse cx="800" cy="48" rx="78" ry="13" fill="none" stroke="#9AF5FF" stroke-width="2.5" opacity=".5" transform="rotate(-16 800 48)"></ellipse>
    <path d="M520 30 L640 72" stroke="url(#jvl-comet)" stroke-width="2.5" stroke-linecap="round"></path>
    <circle cx="640" cy="72" r="3" fill="#FFF3C4" style="filter: drop-shadow(0 0 6px #FFF3C4)"></circle>
    <circle cx="260" cy="195" r="220" fill="url(#jvl-halo)"></circle>
  </svg>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 80% 90% at 45% 50%, rgba(0,0,0,0) 55%, rgba(4,2,14,.6) 100%)"></div>

  <!-- logo left -->
  <div style="position: absolute; left: 50px; top: 30px; width: {{logoW}}px; height: {{logoH}}px">
    <div style="position: absolute; left: 0; top: 0; width: 800px; height: 560px; transform: scale({{scale}}); transform-origin: 0 0">
      <dc-import name="Main" wordmark="{{logo}}" backdrop="{{no}}" hint-size="800px,560px"></dc-import>
    </div>
  </div>

  <!-- right column -->
  <div style="position: absolute; right: 64px; top: 40px; bottom: 21px; width: 280px; display: flex; flex-direction: column; justify-content: center; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; letter-spacing: 2px; font-weight: 700; color: #C4B5FD">OPENING THE VAULT…</span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 22px; color: #FFD23A; text-shadow: 0 2px 0 #5A2200, 0 0 12px rgba(245,179,1,.6)">{{progress}}%</span>
    </div>
    <div style="position: relative; height: 24px; border-radius: 12px; background: #12082E; border: 3px solid #F5B301; box-shadow: 0 0 0 2px #2A0A00, inset 0 3px 6px rgba(0,0,0,.6), 0 0 18px rgba(245,179,1,.35)">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: calc({{progress}}% - 4px); border-radius: 9px; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 8px, rgba(255,255,255,0) 8px 16px), linear-gradient(180deg, #FFF3B0 0%, #FFD23A 45%, #E08A00 55%, #FFB21E 100%); box-shadow: 0 0 12px rgba(255,210,58,.8)">
        <div style="position: absolute; left: 6px; right: 6px; top: 2px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.65)"></div>
      </div>
      <svg width="36" height="36" viewBox="-20 -20 40 40" style="position: absolute; top: -9px; left: calc({{progress}}% - 18px); filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)) drop-shadow(0 0 8px rgba(255,210,58,.9))" aria-hidden="true">
        <defs><radialGradient id="jvl-coin" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF7C8"></stop><stop offset=".45" stop-color="#FFD53D"></stop><stop offset="1" stop-color="#B86A00"></stop></radialGradient></defs>
        <circle cx="1.5" cy="2" r="16" fill="#8A4A00"></circle>
        <circle r="16" fill="url(#jvl-coin)" stroke="#9A5200" stroke-width="2"></circle>
        <circle r="11" fill="none" stroke="#C27800" stroke-width="2"></circle>
        <text x="0" y="5" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="13" fill="#8A4A00">7</text>
      </svg>
    </div>
    <div style="border-radius: 14px; background: rgba(21,16,48,.78); border: 1px solid rgba(167,139,250,.45); padding: 10px 12px; display: flex; gap: 10px; align-items: center">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true" style="flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(245,179,1,.6))">
        <circle cx="20" cy="20" r="18" fill="#2A1060" stroke="#F5B301" stroke-width="2"></circle>
        <circle cx="20" cy="20" r="10" fill="none" stroke="#FFD23A" stroke-width="2"></circle>
        <path d="M20 10 V30 M10 20 H30" stroke="#FFD23A" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="20" cy="20" r="4" fill="#DC2626"></circle>
      </svg>
      <span style="font-size: 15px; font-weight: 600; line-height: 1.25"><strong style="color: #FFD23A">TIP</strong> · Every spin feeds <strong style="color: #FFD23A">4 shared jackpots</strong>, Mini to Grand.</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
      <div style="display: flex; align-items: baseline; gap: 5px; transform: skewX(-12deg)">
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px; color: #FFFFFF">JACK</span>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px; color: #F5B301">VAULT</span>
        <span style="font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px; color: #F87171">777</span>
      </div>
      <div style="font-size: 13px; color: #8A83AD; display: flex; gap: 10px"><span>v1.0.0</span><a href="#" style="text-decoration: underline">Play responsibly</a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390},"logo":{"editor":"enum","options":["777","plain"],"default":"777"},"progress":{"editor":"range","min":0,"max":100,"step":1,"default":60}}'>
class Component extends DCLogic {
  renderVals() {
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const stars = Array.from({ length: 70 }, () => ({ x: (rnd() * 844).toFixed(1), y: (rnd() * 390).toFixed(1), r: (rnd() < .12 ? 1.5 : rnd() * .9 + .3).toFixed(2), o: (rnd() * .6 + .3).toFixed(2) }));
    const logo = this.props.logo || '777';
    const progress = this.props.progress ?? 60;
    const scale = .53;
    return { stars, no: false, logo, progress, scale, logoW: Math.round(800 * scale), logoH: Math.round(560 * scale) };
  }
}
</script>
</body>
</html>
