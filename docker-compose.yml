# Local stack: PostgreSQL + the game server.
#   docker compose up --build
# Then open http://localhost:8080/office. Change the passwords below before using this anywhere real.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jackvault
      POSTGRES_PASSWORD: jackvault-dev-password
      POSTGRES_DB: jackvault
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackvault -d jackvault"]
      interval: 2s
      retries: 30
  server:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://jackvault:jackvault-dev-password@db:5432/jackvault
      ADMIN_KEY: change-me-admin-key
      SEED_DISTRIBUTOR: demo-distributor:demo1234
    ports: ["8080:8080"]
volumes:
  pgdata:
